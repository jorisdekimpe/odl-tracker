<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>De Zeven — Speler</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F3ECDD">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('zs.thema'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --titel:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Noto Serif',serif;
  --tekst:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --grond:#F3ECDD; --vlak:#FBF7EE; --vlak2:#EFE6D3; --kaart:#FFFFFF;
  --lijn:#DED2BC; --lijn-sterk:#C9B99B;
  --inkt:#2A2520; --inkt2:#5C5247; --inkt3:#6E6254;
  --zee:#1F5560; --zee-op:#FBF7EE; --zee-bg:#E3EDEC;
  --nu:#9A6410; --nu-bg:#F6E3BD; --nu-bd:#E2C38A; --nu-tx:#3D2803;
  --goed:#2E7D4F; --goed-bg:#DDEBDD; --goed-tx:#24502F;
  --wacht:#B9770E;
  --fout:#A32D2D; --fout-bg:#FAEDE6; --fout-bd:#E6CFC4; --fout-tx:#7A2E17;
  --h-orelle:#B0432A; --h-kyrenos:#8F6208; --h-dragini:#6A4C93; --h-apollodorus:#2F6690;
  --h-sirius:#1C7568; --h-ox:#5B7A22; --h-wauros:#A23A6E; --h-op:#FFFFFF;
  --schaduw:0 8px 28px rgba(42,37,32,.22);
  --scrim:rgba(20,15,10,.55);
  --donker:#111416; --donker2:#22282B; --donker-lijn:#3A4246; --donker-tx:#EDE4D3; --donker-tx2:#A39886; --papier:#FFFFFF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --grond:#12181B; --vlak:#1A2226; --vlak2:#222C31; --kaart:#1F292E;
  --lijn:#2E3A40; --lijn-sterk:#46555C;
  --inkt:#EDE4D3; --inkt2:#C2B6A3; --inkt3:#A39886;
  --zee:#7FC1C4; --zee-op:#0E1F22; --zee-bg:#17303A;
  --nu:#E0A955; --nu-bg:#3A2C12; --nu-bd:#6A4E1E; --nu-tx:#F7E3BA;
  --goed:#6CC08F; --goed-bg:#1C3324; --goed-tx:#A9D9B5;
  --wacht:#E0A955;
  --fout:#F0908F; --fout-bg:#26191A; --fout-bd:#4A2C23; --fout-tx:#F2B7A2;
  --h-orelle:#F08C6E; --h-kyrenos:#E8B64E; --h-dragini:#B9A0E6; --h-apollodorus:#8DBDE6;
  --h-sirius:#74CDBE; --h-ox:#A9C96B; --h-wauros:#E991BE; --h-op:#12181B;
  --schaduw:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --grond:#12181B; --vlak:#1A2226; --vlak2:#222C31; --kaart:#1F292E;
    --lijn:#2E3A40; --lijn-sterk:#46555C;
    --inkt:#EDE4D3; --inkt2:#C2B6A3; --inkt3:#A39886;
    --zee:#7FC1C4; --zee-op:#0E1F22; --zee-bg:#17303A;
    --nu:#E0A955; --nu-bg:#3A2C12; --nu-bd:#6A4E1E; --nu-tx:#F7E3BA;
    --goed:#6CC08F; --goed-bg:#1C3324; --goed-tx:#A9D9B5;
    --wacht:#E0A955;
    --fout:#F0908F; --fout-bg:#26191A; --fout-bd:#4A2C23; --fout-tx:#F2B7A2;
    --h-orelle:#F08C6E; --h-kyrenos:#E8B64E; --h-dragini:#B9A0E6; --h-apollodorus:#8DBDE6;
    --h-sirius:#74CDBE; --h-ox:#A9C96B; --h-wauros:#E991BE; --h-op:#12181B;
    --schaduw:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--grond);color:var(--inkt)}
body{font-family:var(--tekst);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor}
svg.i.s{width:18px;height:18px}
:focus-visible{outline:2px solid var(--zee);outline-offset:2px}

/* kop */
.top{position:sticky;top:0;z-index:5;background:var(--grond);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--titel);font-size:22px;font-weight:700;color:var(--zee);line-height:1.15}
.top .sub{font-size:13px;color:var(--inkt2);display:flex;align-items:center}
.rond{width:44px;height:44px;border-radius:22px;border:1px solid var(--lijn);background:var(--vlak);color:var(--inkt2);display:grid;place-items:center;flex:none}
.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pil{min-height:44px;border-radius:22px;padding:0 14px;border:1px solid var(--lijn);background:var(--vlak);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--inkt2);white-space:nowrap;flex:none}
.pil .d{width:9px;height:9px;border-radius:50%;background:var(--goed);flex:none}
.pil.bezig .d{background:var(--wacht)}
.pil.fout{background:var(--fout-bg);border-color:var(--fout-bd);color:var(--fout-tx)} .pil.fout .d{background:var(--fout)}
.pil.offline .d{background:none;border:2px solid var(--inkt3)}
.pil.geen{border-style:dashed;border-color:var(--lijn-sterk)} .pil.geen .d{display:none}
.banner{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 16px;font-size:14px;line-height:1.4;border:0;border-bottom:1px solid var(--lijn);background:var(--vlak2);color:var(--inkt)}
.banner.fout{background:var(--fout-bg);border-bottom-color:var(--fout-bd);color:var(--fout-tx)}
.banner svg{margin-top:-1px}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.twee>div{background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:10px 12px;font-size:14px}
.twee ul{list-style:none;margin-top:4px}
.twee li{padding:2px 0}
.bladkop{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.bladkop h2{margin:0}
.meander{display:block;width:100%;height:12px}
.kopblok{position:sticky;top:0;z-index:5;background:var(--grond)}

/* opbouw */
main{max-width:720px;margin:0 auto;padding:14px 16px}
.sec{display:none}.sec.on{display:block}
h2{font-family:var(--titel);font-size:21px;font-weight:700;margin:20px 0 10px;color:var(--inkt);line-height:1.2}
h2:first-child{margin-top:4px}
h3{font-family:var(--titel);font-size:17px;font-weight:700;margin-bottom:2px;line-height:1.25}
.card,.kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.hero{background:var(--nu-bg);border-color:var(--nu-bd);color:var(--nu-tx)}
.card.hero .small,.card.hero .kicker{color:var(--nu-tx)}
.kicker,.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--inkt2);font-weight:700}
.muted{color:var(--inkt3);font-size:13px}
.small{font-size:13px;color:var(--inkt2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--vlak2);color:var(--inkt2);white-space:nowrap}
.chip.nu{background:var(--nu-bg);color:var(--nu-tx)} .chip.goed,.chip.g{background:var(--goed-bg);color:var(--goed-tx)}
.chip.fout,.chip.b{background:var(--fout-bg);color:var(--fout-tx)} .chip.zee,.chip.r{background:var(--zee-bg);color:var(--zee)}
.chip.kaart{background:var(--kaart);color:var(--inkt2)}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* knoppen en velden */
.knop,.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--lijn-sterk);background:var(--vlak);color:var(--inkt);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.knop.p,.btn.p{background:var(--zee);border-color:var(--zee);color:var(--zee-op)}
.knop.groot{min-height:56px;font-size:19px}
.knop.gevaar{color:var(--fout-tx);border-color:var(--fout-bd);background:var(--fout-bg)}
.knop.ok{background:var(--goed-bg);border-color:transparent;color:var(--goed-tx)}
.btn.s{padding:0 12px;font-size:14px}
.btn.g,.knop.g{background:none;border-color:transparent;color:var(--inkt2)}
.knop:disabled,.btn:disabled{opacity:.5}
.knop.vol{width:100%}
input,textarea,select,.veld{width:100%;min-height:48px;border:1px solid var(--lijn-sterk);border-radius:12px;background:var(--kaart);padding:0 14px;font-size:16px;color:var(--inkt)}
textarea{min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--inkt3)}
input:focus,textarea:focus{outline:2px solid var(--zee);outline-offset:-1px}
label.f{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--inkt2);margin:12px 0 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--vlak2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--inkt2)}
.seg button.on{background:var(--kaart);color:var(--zee);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.filt,.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;scrollbar-width:none}
.filt button,.filters button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--lijn-sterk);background:transparent;font-weight:600;color:var(--inkt2);white-space:nowrap;flex:none}
.filt button.on,.filters button.on{background:var(--zee);border-color:var(--zee);color:var(--zee-op)}
.rij{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--lijn)}
.rij:last-child{border-bottom:0}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--lijn-sterk);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--kaart);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"]{background:var(--zee)} .sw[aria-checked="true"] i{left:23px}
.sw:disabled{opacity:.45}

/* heldenavatar */
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--av);color:var(--h-op);font-family:var(--titel);font-weight:700;flex:none;line-height:1}

/* details */
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{transition:transform .15s;display:inline-flex;color:var(--inkt3)}
details[open]>summary .chev{transform:rotate(90deg)}
.steps{margin:10px 0 0 0;list-style:none}
.steps li{padding:5px 0 5px 24px;position:relative;font-size:14px}
.steps li::before{content:"";position:absolute;left:3px;top:11px;width:10px;height:10px;border:1.5px solid var(--zee);border-radius:2px;transform:rotate(45deg)}
.steps li.done::before{background:var(--zee)}

/* onderbalk */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--vlak);border-top:1px solid var(--lijn);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:max(16px,env(safe-area-inset-bottom))}
.nav button{background:none;border:0;border-top:3px solid transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--inkt2)}
.nav button.on{color:var(--zee);border-top-color:var(--zee);font-weight:700}

/* lijsten */
.search{margin-bottom:10px}
.npc .att{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.att.vriendelijk{background:var(--goed)} .att.vijandig{background:var(--fout)} .att.neutraal{background:var(--inkt2)} .att.onbekend{background:var(--inkt3)}
.lore{margin-top:10px;padding:10px 12px;background:var(--vlak2);border-radius:10px;font-family:var(--titel);font-size:16px;font-style:italic;color:var(--inkt2)}
.lore .kicker{font-family:var(--tekst);font-style:normal;display:block;margin-bottom:2px}
.note{margin-top:10px;border-top:1px dashed var(--lijn-sterk);padding-top:10px}
.note textarea{min-height:64px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:10px;text-align:center}
.stat .val{font-family:var(--titel);font-size:26px;font-weight:700;line-height:1.1;margin:2px 0}
.stat .val input{font-family:var(--titel);font-size:26px;font-weight:700;text-align:center;border:none;background:none;padding:0;width:4ch;min-height:40px}
.stat .ctl{display:flex;justify-content:center;gap:8px}
.stat .ctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--lijn-sterk);background:var(--kaart);font-size:18px}
.hpbar{height:8px;border-radius:4px;background:var(--vlak2);overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--goed)}
.item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--lijn)}
.item:last-child{border-bottom:none}
.item .nm{font-weight:600}
.item .qty{display:flex;align-items:center;gap:4px}
.item .qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--lijn-sterk);background:var(--kaart)}
.item .qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.ico{background:none;border:none;color:var(--inkt3);width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;flex:none}
.ico.on{color:var(--zee)}
.heroes{display:grid;grid-template-columns:1fr;gap:10px}
.heroes button{text-align:left;background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:10px 14px;min-height:66px;display:flex;align-items:center;gap:12px}
.heroes button b{display:block;font-size:17px}
.sheet{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 0;border-bottom:1px solid var(--lijn)}
.sheet:last-child{border-bottom:none}
.lock{font-size:12px;color:var(--zee)}
a{color:var(--zee)}
.empty{text-align:center;color:var(--inkt3);padding:18px 8px;font-size:15px}
.hide{display:none!important}

/* blad (modal) */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box,.blad{background:var(--vlak);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.25)}
.greep{width:40px;height:5px;border-radius:3px;background:var(--lijn-sterk);margin:0 auto 12px}
.modal .card{background:var(--kaart)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:30;background:var(--donker);color:var(--donker-tx);display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer .vt{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.viewer .btn{background:var(--donker2);border-color:var(--donker-lijn);color:var(--donker-tx)}
.viewer .vb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
.viewer canvas,.viewer img{display:block;margin:0 auto 8px;background:var(--papier);max-width:none}
.viewer .empty{color:var(--donker-tx2)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--inkt);color:var(--grond);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;display:flex;align-items:center;gap:12px}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:var(--grond);font-weight:700;text-decoration:underline;min-height:32px}
</style>
</head>
<body>

<div class="kopblok">
<header class="top">
  <div class="grow">
    <h1>De Zeven</h1>
    <div class="sub" id="subline">Odyssey of the Dragonlords</div>
  </div>
  <button class="pil geen" id="pil" onclick="openSync()"><span class="d"></span><span id="pilTx">Enkel dit toestel</span></button>
  <button class="rond" id="cfgBtn" onclick="openSettings()" aria-label="Instellingen"></button>
</header>
<svg class="meander" aria-hidden="true" preserveAspectRatio="none"><defs><pattern id="meander" width="20" height="12" patternUnits="userSpaceOnUse"><path d="M0 11.25H20M2 11.25V1H16V8H7V4H12" style="fill:none;stroke:var(--zee);stroke-width:1.4"/></pattern></defs><rect width="100%" height="12" fill="url(#meander)"/></svg>
<div id="banner"></div>
</div>

<main>
  <section class="sec on" id="s-verhaal"></section>
  <section class="sec" id="s-npcs">
    <input class="search" id="npcQ" type="search" placeholder="Zoek een naam of plek…" oninput="renderNpcs()">
    <div class="filters" id="npcF"></div>
    <div id="npcList"></div>
  </section>
  <section class="sec" id="s-held"></section>
  <section class="sec" id="s-party"></section>
</main>

<nav class="nav" id="nav" aria-label="Hoofdmenu"></nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div class="viewer" id="viewer">
  <div class="vt"><button class="btn s" onclick="closeViewer()">Sluiten</button><span class="grow" id="vTitle" style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="btn s" onclick="zoom(-1)">−</button><button class="btn s" onclick="zoom(1)">+</button></div>
  <div class="vb" id="vBody"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" class="hide" accept="application/pdf,image/*" onchange="onSheetFile(this)">

<script>
'use strict';
/* ============ basis ============ */
var DEFAULT_REPO='jorisdekimpe/odl-spelers';
var MAX_ATTUNE=3;
var D=null;               // spelers.json
var party={};             // id -> remote inventaris (Party-tab)
var partyAt=0;
var curTab=lsGet('zs.tab','verhaal');
var npcFilter='alle';

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('Opslaan op dit toestel mislukt');}}
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2600);}
function typing(){var a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
function ago(t){if(!t)return'nooit';var s=Math.round((now()-t)/1000);if(s<60)return'net nu';if(s<3600)return Math.round(s/60)+' min geleden';if(s<86400)return Math.round(s/3600)+' u geleden';return new Date(t).toLocaleDateString('nl-BE',{day:'numeric',month:'short'});}

var IC={
  verhaal:'<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h11"/>',

/* ============ GitHub ============ */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}

function ghGetJson(path){
  return gh(path).then(function(r){

    if(!r.ok){var e=new Error('GitHub '+r.status);e.status=r.status;throw e;}
    return r.json().then(function(j){return {data:JSON.parse(b64dec(j.content)),sha:j.sha};});
  });
}
function ghPutRaw(path,b64,sha,msg){

var PILTX={ok:'Bewaard',bezig:'Bewaren…',fout:'Niet bewaard',offline:'Offline',geen:'Enkel dit toestel'};

function schedulePush(){if(!syncOn())return;clearTimeout(pushT);pushT=setTimeout(syncOwn,2500);if(navigator.onLine&&SYNC.state!=='fout')setSync('bezig');}
function syncOwn(){
  var x=inv();if(!x||!syncOn())return Promise.resolve();
  if(busy){schedulePush();return Promise.resolve();}
  if(!navigator.onLine){toonSync();return Promise.resolve();}
  busy=true;if(SYNC.state!=='fout')setSync('bezig');
  var path='inventaris/'+x.held+'.json',needRender=false;
  return uploadPendingSheets(x).then(function(){
    x=inv();
    return ghGetJson(path);
  }).then(function(rem){

    var changed=!same(m,rem.data);
    if(!same(m,x))needRender=true;
    if(heroId()===x.held){lsSet('zs.inv.'+x.held,m);}
    if(!changed){lsSet('zs.dirty.'+x.held,false);return;}
    var info=heroInfo(x.held);
    return ghPutRaw(path,b64enc(JSON.stringify(m,null,1)),rem.sha,'Inventaris '+(info?info.naam:x.held)).then(function(){lsSet('zs.dirty.'+x.held,false);});

var idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise(function(res,rej){var r=indexedDB.open('zs-sheets',1);r.onupgradeneeded=function(){r.result.createObjectStore('f');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return idbP;}

  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var M=maxZ||2000,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){res(b||file);},'image/jpeg',kw||.85);};

function pickSheet(){$('fileIn').value='';$('fileIn').click();}
function sniff(f){return f.slice(0,8).arrayBuffer().then(function(buf){var u=new Uint8Array(buf),t=String.fromCharCode.apply(null,u.subarray(0,5));if(t==='%PDF-')return 'pdf';if(u[0]===0xFF&&u[1]===0xD8)return 'img';if(u[0]===0x89&&u[1]===0x50)return 'img';return null;}).catch(function(){return null;});}
function onSheetFile(el){
  var f=el.files&&el.files[0];if(!f)return;var x=inv();if(!x)return;
  sniff(f).then(function(kind){
    var isPdf=kind==='pdf'||f.type==='application/pdf'||/\.pdf$/i.test(f.name);
    var isImg=!isPdf&&(kind==='img'||/^image\//.test(f.type));
    if(!isPdf&&!isImg){toast('Dit bestand herken ik niet als PDF of foto');return;}
    return (isPdf?Promise.resolve(f):shrinkImage(f)).then(function(b){
      if(b.size>8*1024*1024){toast('Bestand te groot ('+(b.size/1048576).toFixed(1)+' MB, max 8 MB)');return;}
      var id=uid(),ext=isPdf?'pdf':'jpg',key=x.held+'/'+id;
      var s={id:id,c:now(),t:now(),name:(f.name||'').replace(/\.[^.]+$/,'')||'Sheet',type:isPdf?'pdf':'img',path:'sheets/'+x.held+'/'+id+'.'+ext,up:false};
      return idbPut(key,b).catch(function(){memBlobs[key]=b;}).then(function(){x=inv();x.sheets.push(s);saveInv(x);renderHeld();toast(syncOn()?'Toegevoegd, wordt gesynct…':'Toegevoegd op dit toestel (geen sync ingesteld)');});
    });

function sheetErr(e){if(!e)return 'onbekende fout';if(e.status===413)return 'te groot voor GitHub';if(e.status===401||e.status===403)return 'sleutel geweigerd';if(e.status===422)return 'GitHub weigerde het bestand';return e.message||String(e);}

  var gone=(x.sheets||[]).filter(function(s){return s.del&&s.up&&!s.gone;});
  var p=Promise.resolve(),fails=[];
  todo.forEach(function(s){p=p.then(function(){return idbGet(x.held+'/'+s.id);}).then(function(b){
    if(!b){markSheet(x.held,s.id,function(q){q.err='bestand staat niet meer op dit toestel, verwijder en upload opnieuw';});fails.push(s.name);return;}
    return blobB64(b).then(function(b64){return ghSha(s.path).then(function(sha){return ghPutRaw(s.path,b64,sha,'Sheet '+s.name);});})
      .then(function(){markSheet(x.held,s.id,function(q){q.up=true;delete q.err;q.t=now();});delete memBlobs[x.held+'/'+s.id];})
      .catch(function(e){markSheet(x.held,s.id,function(q){q.err=sheetErr(e);q.errc=e&&e.status||0;});fails.push(s.name);});
  });});

}

    return gh(s.path,{raw:true}).then(function(r){if(!r.ok)throw new Error('GitHub '+r.status);return r.blob();}).then(function(b){return idbPut(owner+'/'+s.id,b).then(function(){return b;});});

function renderViewer(){

}

/* ============ tabs ============ */
function tab(t){
  if(!$('s-'+t))t='verhaal';
  curTab=t;lsSet('zs.tab',t);
  document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id==='s-'+t);});
  document.querySelectorAll('.nav button').forEach(function(b){var on=b.getAttribute('data-t')===t;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  window.scrollTo(0,0);render();
  if(t==='party'&&now()-partyAt>60000)pullParty();
}
function render(){
  if(!D){$('s-verhaal').innerHTML='<div class="empty">Verhaal laden…</div>';return;}
  var h=heroInfo(heroId());
  $('subline').textContent=isDM()?'DM-modus · level '+D.level:(h?h.naam.split(' ')[0]+' · level '+D.level:'Level '+D.level+' · kies je held');
  if(curTab==='verhaal')renderVerhaal();
  if(curTab==='npcs')renderNpcs();

function stepper(k,label,val,extra){return '<div class="stat"><div class="lbl">'+label+'</div><div class="val"><input inputmode="numeric" placeholder="—" value="'+esc(val)+'" onchange="setStat(\''+k+'\',this.value)"></div><div class="ctl"><button onclick="bump(\''+k+'\',-1)">−</button><button onclick="bump(\''+k+'\',1)">+</button></div>'+(extra||'')+'</div>';}

function setStat(k,v){var x=inv(),n=parseInt(v,10);setF(x,k,isNaN(n)?'':n);saveInv(x);renderHeld();}
function bump(k,d){var x=inv(),v=parseInt(fv(x,k,0),10)||0;v+=d;if(k==='hp'){var m=parseInt(fv(x,'hpmax',0),10);if(m>0)v=Math.min(v,m);}if(k!=='goud'&&v<0)v=0;setF(x,k,v);saveInv(x);renderHeld();}
function setDdb(v){var x=inv();v=v.trim();if(v&&!/^https?:\/\//i.test(v))v='https://'+v;setF(x,'ddb',v);saveInv(x);renderHeld();}
function findItem(x,id){for(var i=0;i<x.items.length;i++)if(x.items[i].id===id)return x.items[i];return null;}
function addItem(){var n=$('newItem').value.trim();if(!n)return;var q=parseInt($('newQty').value,10)||1;var x=inv();x.items.push({id:uid(),c:now(),t:now(),naam:n,aantal:q});saveInv(x);renderHeld();setTimeout(function(){$('newItem').focus();},0);}
function qty(id,d){var x=inv(),it=findItem(x,id);if(!it)return;it.aantal=Math.max(0,(it.aantal||0)+d);it.t=now();if(it.aantal===0&&!confirm(it.naam+' op 0 — verwijderen?')){it.aantal=1;}else if(it.aantal===0){it.del=true;}saveInv(x);renderHeld();}
function toggleItem(id,k){var x=inv(),it=findItem(x,id);if(!it)return;if(k==='att'&&!it.att&&x.items.filter(function(i){return i.att&&!i.del;}).length>=MAX_ATTUNE){toast('Je kan maar '+MAX_ATTUNE+' items attunen');return;}it[k]=!it[k];it.t=now();saveInv(x);renderHeld();}

  openModal();

/* ============ party ============ */
function pullParty(){
  if(!syncOn()||!D){renderParty();return Promise.resolve();}
  partyAt=now();var nee=0;
  return Promise.all(D.helden.map(function(h){return ghGetJson('inventaris/'+h.id+'.json').then(function(r){party[h.id]=r.data;},function(e){if(e&&(e.status===401||e.status===403))nee++;});})).then(function(){
    if(nee===D.helden.length)setSync('fout',{code:'sleutel',status:401});
    var me=heroId();if(me&&me!=='dm'&&party[me]){var m=merge(inv(),party[me]);lsSet('zs.inv.'+me,m);}
    if(curTab==='party')renderParty();
  });
}
function renderParty(){
  var el=$('s-party');if(!D)return;

    var x=h.id===me?inv():party[h.id];

    o.push('<div style="margin-top:8px">'+(items.length?items.map(function(it){return '<div class="item"><div class="grow"><span class="nm">'+esc(it.naam)+'</span>'+(it.att?' <span class="chip r">attuned</span>':'')+(it.priv?' <span class="lock">· privé</span>':'')+(it.notitie?'<div class="muted">'+esc(it.notitie)+'</div>':'')+'</div><span class="muted">×'+esc(it.aantal)+'</span></div>';}).join(''):'<div class="muted">Geen zichtbare items.</div>'));
    if(showSheets)o.push('<div style="margin-top:8px">'+sheets.map(function(s){return '<div class="sheet"><span class="chip">'+(s.type==='pdf'?'PDF':'foto')+'</span><a href="#" class="grow" onclick="openSheet(\''+h.id+'\',\''+s.id+'\');return false">'+esc(s.name)+'</a></div>';}).join('')+'</div>');
    if(dm&&x&&fv(x,'ddb',''))o.push('<a class="btn s" style="display:inline-block;margin-top:8px;text-decoration:none" href="'+esc(fv(x,'ddb',''))+'" target="_blank" rel="noopener">D&amp;D Beyond</a>');
    if(x&&x.updated)o.push('<div class="muted" style="margin-top:6px">Bijgewerkt '+ago(x.updated)+'</div>');
    o.push('</div></details>');
  });
  el.innerHTML=o.join('');

function openModal(naam){bladOpen=naam||'blad';var bx=$('modalBox');if(bx.firstChild&&!(bx.firstChild.classList&&bx.firstChild.classList.contains('greep')))bx.insertAdjacentHTML('afterbegin','<div class="greep" aria-hidden="true"></div>');$('modal').classList.add('on');}
function closeModal(){bladOpen=null;$('modal').classList.remove('on');}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('viewer').classList.contains('on'))closeViewer();else if(bladOpen)closeModal();}});
function openSync(){renderSyncBlad();openModal('sync');}
function renderSyncBlad(){
  var st=syncState(),last=lsGet('zs.lastSync',0),o=[];
  o.push('<div class="greep" aria-hidden="true"></div><div class="bladkop"><h2 class="grow">Sync</h2><span class="muted">'+(syncOn()?'Laatst bewaard '+esc(tijdKort(last)):'')+'</span></div>');
  if(!syncOn()){
    o.push('<p class="small" style="font-size:15px">Je gegevens staan enkel op dit toestel. Koppel met de tafel om je HP, inventaris en sheet met de DM te delen en de rest van de party te zien.</p>');
    o.push('<div class="twee"><div><span class="lbl">Op dit toestel</span><ul><li>HP en stats</li><li>Inventaris</li><li>Sheets</li><li>Notities</li></ul></div><div><span class="lbl">Na koppelen</span><ul><li>Gedeeld met de DM</li><li>Party zichtbaar</li></ul></div></div>');
    o.push('<button class="knop p vol" onclick="closeModal();openSettings()">'+ic('link','s')+'Koppel met de tafel</button>');
  }else{
    var code=SYNC.detail&&SYNC.detail.code;
    var zin=st==='ok'?'Alles is bewaard op GitHub.':st==='bezig'?'Je wijzigingen worden nu bewaard.':st==='offline'?'Geen verbinding. Je wijzigingen staan veilig op dit toestel en worden bewaard zodra je weer online bent.':(FOUTLANG[code]||FOUTLANG.gh);
    o.push('<p style="font-size:15px;'+(st==='fout'?'color:var(--fout-tx)':'')+'">'+esc(zin)+'</p>');
    var h=heroId();if(h&&h!=='dm'&&lsGet('zs.dirty.'+h,false)&&st!=='ok')o.push('<p class="small" style="margin-top:6px">Wacht om bewaard te worden: je laatste wijzigingen.</p>');
    var x=inv(),bad=x?x.sheets.filter(function(q){return !q.del&&!q.up&&q.err;}):[];
    if(bad.length)o.push('<div class="kaart" style="margin-top:12px;background:var(--kaart)"><span class="lbl">Sheets niet geüpload</span>'+bad.map(function(q){return '<div class="rij"><span class="grow"><b>'+esc(q.name)+'</b><br><span class="small">'+esc(q.err)+'</span></span>'+(teGroot(q)&&q.type==='img'?'<button class="knop" onclick="verklein(\''+q.id+'\')">Verklein</button>':'<button class="knop" onclick="retrySheet(\''+q.id+'\')">Opnieuw</button>')+'</div>';}).join('')+'</div>');
    o.push('<div class="twee"><div><span class="lbl">Op GitHub</span><ul><li>HP en stats</li><li>Inventaris</li><li>Sheets</li></ul></div><div><span class="lbl">Enkel dit toestel</span><ul><li>Notities</li><li>NPC-notities</li></ul><span class="muted">Zit in je back-up via Instellingen.</span></div></div>');
    o.push('<div style="display:grid;gap:10px"><button class="knop p vol" onclick="syncOwn().then(function(){return pullParty();})">'+ic('ververs','s')+'Opnieuw proberen</button><button class="knop vol" onclick="closeModal();openSettings()">Koppeling nakijken</button></div>');
  }
  $('modalBox').innerHTML=o.join('');
}
function openSettings(){
  var c=syncCfg(),h=heroInfo(heroId());
  $('modalBox').innerHTML='<h2 style="margin-top:0">Instellingen</h2>'+
  '<div class="card"><h3>Held</h3><div class="small">'+(isDM()?'DM-modus':h?esc(h.naam)+' ('+esc(h.speler)+')':'Nog niet gekozen')+'</div><button class="btn s" style="margin-top:8px" onclick="lsSet(\'zs.held\',null);closeModal();tab(\'held\')">Andere held kiezen</button></div>'+
  '<div class="card"><h3>Sync</h3><div class="small">Plak hier de sleutel die je van de DM kreeg. Daarmee worden je inventaris en sheet gedeeld met de DM en zie je de rest van de party.</div><label class="f">Sleutel</label><input id="cfgTok" type="password" autocomplete="off" value="'+esc(c.token)+'" placeholder="github_pat_…"><details style="margin-top:8px"><summary class="muted">Geavanceerd</summary><label class="f">Repo</label><input id="cfgRepo" value="'+esc(c.repo)+'"></details><div class="row" style="margin-top:10px"><button class="btn p" onclick="saveCfg()">Bewaar &amp; test</button>'+(c.token?'<button class="btn" onclick="clearCfg()">Ontkoppel</button>':'')+'</div><div id="cfgMsg" class="muted" style="margin-top:6px"></div></div>'+
  '<div class="card"><h3>Weergave</h3><div class="seg" style="margin-top:8px">'+[['system','Systeem'],['light','Licht'],['dark','Donker']].map(function(o){return '<button data-thema="'+o[0]+'" class="'+(thema()===o[0]?'on':'')+'" onclick="zetThema(\''+o[0]+'\')">'+o[1]+'</button>';}).join('')+'</div></div>'+
  '<div class="card"><h3>Back-up</h3><div class="small">Je inventaris als bestand bewaren of terugzetten.</div><div class="row" style="margin-top:8px"><button class="btn s" onclick="exportInv()">Exporteer</button><button class="btn s" onclick="importInv()">Importeer</button></div></div>'+
  '<div class="row"><span class="grow muted">Verhaal bijgewerkt '+(D?esc(D.bijgewerkt):'—')+'</span><button class="btn" onclick="closeModal()">Sluiten</button></div>';
  openModal('instellingen');
}
function saveCfg(){
  var c={token:$('cfgTok').value.trim(),repo:($('cfgRepo').value||DEFAULT_REPO).trim()};lsSet('zs.sync',c);
  $('cfgMsg').textContent='Testen…';
  fetch('https://api.github.com/repos/'+c.repo,{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}}).then(function(r){
    if(r.ok)return r.json().then(function(j){if(j.permissions&&!j.permissions.push){$('cfgMsg').textContent='Gekoppeld, maar deze sleutel mag niet schrijven.';return;}$('cfgMsg').textContent='Gekoppeld.';setSync('ok');syncOwn().then(pullParty);});
    $('cfgMsg').textContent=r.status===404?'De opslag is niet gevonden of de sleutel heeft er geen toegang toe.':'GitHub weigert deze sleutel.';setSync('fout',{code:r.status===404?'repo':'sleutel',status:r.status});
  },function(){$('cfgMsg').textContent='Geen verbinding.';});
}
function clearCfg(){lsSet('zs.sync',{repo:DEFAULT_REPO,token:''});SYNC={state:'ok'};lsSet('zs.syncState',SYNC);toonSync();closeModal();render();}
function exportInv(){var x=inv();if(!x){toast('Kies eerst een held');return;}var b=new Blob([JSON.stringify(x,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inventaris-'+x.held+'.json';a.click();}
function importInv(){var i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=function(){var f=i.files[0];if(!f)return;f.text().then(function(t){var y=JSON.parse(t),x=inv();if(!x||y.held!==x.held){toast('Dit bestand hoort bij een andere held');return;}saveInv(merge(x,y));closeModal();renderHeld();toast('Teruggezet');}).catch(function(){toast('Ongeldig bestand');});};i.click();}
function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
function askDM(){var p=prompt('DM-pincode');if(!p)return;sha256('zeven:'+p.trim()).then(function(h){if(D&&h===D.dmPinHash){lsSet('zs.held','dm');toast('DM-modus aan');tab('party');}else toast('Verkeerde code');});}

/* ============ start ============ */
function loadData(){
  return fetch('spelers.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){D=d;lsSet('zs.data',d);},function(){D=lsGet('zs.data',null);if(!D)$('s-verhaal').innerHTML='<div class="empty">Geen verbinding en nog niets opgeslagen.</div>';});
}
pasThemaToe();bouwNav();
loadData().then(function(){
  tab(curTab);
  toonSync();
  if(syncOn())syncOwn().then(function(){return pullParty();});
});
window.addEventListener('online',function(){toonSync();if(syncOn())syncOwn();});
window.addEventListener('offline',toonSync);
setInterval(function(){if(syncOn()&&!document.hidden)toonSync();},60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){loadData().then(function(){if(!typing())render();});if(syncOn())syncOwn();}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
