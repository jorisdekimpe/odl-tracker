<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Zeven — Verhaal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#854F0B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#efefec;--text:#1a1a18;--text2:#5a5a56;--text3:#8a8a84;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);--acc:#854F0B;--r:10px;--rs:6px;
  --amber-bg:#FAEEDA;--amber-bd:#FAC775;--amber-tx:#633806;
  --teal-bg:#E1F5EE;--teal-bd:#9FE1CB;--teal-tx:#085041;
  --green-bg:#EAF3DE;--green-bd:#C0DD97;--green-tx:#27500A;
  --blue-bg:#E6F1FB;--blue-bd:#85B7EB;--blue-tx:#0C447C;
  --coral-bg:#FAECE7;--coral-bd:#F0997B;--coral-tx:#993C1D;
  --red-bg:#FCEBEB;--red-bd:#F09595;--red-tx:#A32D2D;
  --purple-bg:#EEEDFE;--purple-bd:#AFA9EC;--purple-tx:#3C3489;
  --gray-bg:#F1EFE8;--gray-tx:#444441;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#2a2a28;--bg3:#151514;--text:#e8e8e2;--text2:#a8a8a2;--text3:#707068;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--acc:#E0A35A;
  --amber-bg:#3a2a12;--amber-bd:#7a5520;--amber-tx:#f5d29a;--teal-bg:#123029;--teal-bd:#2c6b5a;--teal-tx:#9fe1cb;
  --green-bg:#1f2c14;--green-bd:#4b6b2c;--green-tx:#c0dd97;--blue-bg:#14253a;--blue-bd:#2f5a8a;--blue-tx:#a9cdf2;
  --coral-bg:#3a1f17;--coral-bd:#8a4a33;--coral-tx:#f5b49b;--red-bg:#3a1717;--red-bd:#8a3a3a;--red-tx:#f5a3a3;
  --purple-bg:#24223f;--purple-bd:#5a54a0;--purple-tx:#c9c4f5;--gray-bg:#2a2a26;--gray-tx:#cfcfc6;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg3);color:var(--text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top h1{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--acc);text-transform:uppercase;white-space:nowrap}
.top .stand{font-size:12px;color:var(--text3);flex:1 1 220px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top input{flex:1 1 180px;min-width:120px;font-size:14px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg);color:var(--text)}
.btn{font-size:13px;font-weight:500;padding:8px 12px;border:1px solid var(--border2);border-radius:var(--rs);background:transparent;white-space:nowrap;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{background:var(--bg2)}
.btn.on{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-tx)}
.btn.s{padding:4px 9px;font-size:12px;min-height:30px}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--gray-bg);color:var(--gray-tx);white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green-tx)}.pill.warn{background:var(--amber-bg);color:var(--amber-tx)}.pill.err{background:var(--red-bg);color:var(--red-tx)}
.layout{display:flex;height:calc(100vh - 53px);height:calc(100dvh - 53px)}
.list{width:400px;flex:0 0 400px;overflow-y:auto;border-right:1px solid var(--border);background:var(--bg3);padding:10px 10px 80px}
.detail{flex:1;overflow-y:auto;background:var(--bg);padding:18px 22px 90px}
.empty{color:var(--text3);padding:40px 10px;text-align:center}
.act{margin:6px 0 4px}
.act>button{width:100%;text-align:left;background:none;border:none;padding:10px 4px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);display:flex;gap:8px;align-items:center}
.act>button .cnt{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--text3)}
.grp{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.grp>.gh{width:100%;text-align:left;background:none;border:none;padding:10px 12px;display:block}
.gh .gt{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.gh .gs{font-size:12px;color:var(--text3);margin-top:2px}
.gh .gt .cnt{margin-left:auto;font-weight:400;font-size:12px;color:var(--text3)}
.grp.grof .gh .gt::after{content:'grof';font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--gray-bg);color:var(--gray-tx)}
.kop{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:10px 12px 4px;border-top:1px solid var(--border)}
.row{width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--border);padding:9px 12px;display:flex;gap:10px;align-items:flex-start;min-height:44px}
.row:hover{background:var(--bg2)}
.row.sel{background:var(--amber-bg)}
.row .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px;border:2px solid var(--text3)}
.dot.klaar{background:var(--green-tx);border-color:var(--green-tx)}
.dot.nu{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 3px var(--amber-bd)}
.dot.open{border-color:var(--blue-tx)}
.dot.optie{border-color:var(--text3);border-style:dashed}
.dot.later{border-color:var(--border2)}
.dot.skip{background:var(--border2);border-color:var(--border2)}
.row .rt{flex:1;min-width:0}
.row .rn{font-size:14px;font-weight:500}
.row.klaar .rn,.row.skip .rn{color:var(--text3)}
.row.skip .rn{text-decoration:line-through}
.row .rw{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:110px}
.tag{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:99px;background:var(--gray-bg);color:var(--gray-tx);white-space:nowrap}
.tag.gevecht{background:var(--red-bg);color:var(--red-tx)}.tag.sociaal{background:var(--blue-bg);color:var(--blue-tx)}
.tag.val{background:var(--coral-bg);color:var(--coral-tx)}.tag.keuze{background:var(--purple-bg);color:var(--purple-tx)}
.tag.beloning{background:var(--green-bg);color:var(--green-tx)}.tag.ster{background:var(--amber-bg);color:var(--amber-tx)}
.tag.lok{background:var(--purple-bg);color:var(--purple-tx)}
.fork{padding:8px 10px 10px;border-top:1px solid var(--border);background:var(--bg2)}
.fork .fl{font-size:12px;color:var(--text2);margin-bottom:6px}
.fork .ft{display:flex;gap:6px;flex-wrap:wrap}
/* detail */
.dh{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.dh h2{font-size:21px;font-weight:650;line-height:1.25;flex:1 1 300px}
.back{display:none}
.dmeta{font-size:13px;color:var(--text2);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px 14px}
.dmeta b{color:var(--text);font-weight:600}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stat .btn{min-height:32px;padding:5px 10px;font-size:12px}
.stat .btn.on.klaar{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-tx)}
.stat .btn.on.open{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue-tx)}
.stat .btn.on.skip{background:var(--gray-bg);color:var(--gray-tx)}
.sec{border-left:4px solid var(--border2);background:var(--bg2);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;margin-bottom:12px}
.sec h3{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.sec.kern{border-color:var(--acc);background:var(--bg2)}
.sec.kern p{font-size:15.5px}
.sec.zeg{border-color:var(--amber-bd);background:var(--amber-bg)}.sec.zeg h3{color:var(--amber-tx)}
.sec.dia{border-color:var(--blue-bd)}.sec.doen{border-color:var(--teal-bd)}
.sec.vij{border-color:var(--red-bd)}.sec.buit{border-color:var(--green-bd)}
.sec.haken{border-color:var(--purple-bd)}.sec.dm{border-color:var(--red-tx);background:var(--red-bg)}.sec.dm h3{color:var(--red-tx)}
.sec.open{border-color:#E08A1E;background:var(--amber-bg)}.sec.open h3{color:var(--amber-tx)}
.sec ul{padding-left:18px}.sec li{margin:3px 0}
.sec.zeg li{font-weight:500}
.dlg{margin:6px 0 10px}.dlg .who{font-weight:650;font-size:14px;margin-bottom:2px}
.chk{list-style:none;padding-left:0!important}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.chk input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--acc)}
.chk li.done span{color:var(--text3);text-decoration:line-through}
.hk{display:flex;gap:10px;margin:6px 0}
.hk .hn{flex:0 0 112px;font-weight:650;font-size:13.5px}
.hk .hn small{display:block;font-weight:400;color:var(--text3);font-size:11.5px}
.hk .ht{flex:1}
.vp{text-decoration:none}
.voorstel{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--purple-bg);color:var(--purple-tx);margin-right:4px}
.src{font-size:12px;color:var(--text3);margin-top:8px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
/* foes */
.foe{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);margin:8px 0;overflow:hidden}
.foe>.fh{width:100%;text-align:left;background:none;border:none;padding:9px 11px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fh .fn{font-weight:650;flex:1 1 160px}
.fh .fq{font-weight:700;color:var(--red-tx)}
.fh .fs{font-size:12.5px;color:var(--text2);white-space:nowrap}
.foe .fnote{font-size:13px;color:var(--text2);padding:0 11px 8px}
.hpbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 11px 10px}
.hpbox{display:flex;align-items:center;gap:2px;border:1px solid var(--border2);border-radius:var(--rs);padding:2px}
.hpbox span{font-size:11px;color:var(--text3);padding:0 4px}
.hpbox input{width:52px;font-size:14px;text-align:center;border:none;background:transparent;color:var(--text);padding:4px 0}
.hpbox input.dead{color:var(--red-tx);text-decoration:line-through}
.hpbox button{border:none;background:var(--bg2);border-radius:4px;width:28px;height:28px;font-size:15px}
.sb{border-top:1px solid var(--border);padding:10px 12px 12px;font-size:13.5px;background:var(--bg)}
.sb .sbn{font-size:17px;font-weight:700;color:var(--red-tx);font-variant:small-caps;letter-spacing:.02em}
.sb .sbm{font-style:italic;color:var(--text2);margin-bottom:6px}
.sb hr{border:none;border-top:2px solid var(--red-bd);margin:6px 0}
.sb .abil{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;margin:4px 0}
.sb .abil b{display:block;font-size:11px;color:var(--red-tx)}
.sb p{margin:3px 0}
.sb h4{font-size:13px;color:var(--red-tx);border-bottom:1px solid var(--red-bd);margin:8px 0 4px;font-variant:small-caps;font-size:15px}
.sb .note{background:var(--amber-bg);color:var(--amber-tx);padding:6px 8px;border-radius:var(--rs);margin-top:8px}
.sb .ssrc{font-size:11px;color:var(--text3);margin-top:6px}
@media (max-width:900px){
  .layout{display:block;height:auto}
  .list{width:auto;border-right:none;padding-bottom:40px}
  .detail{position:fixed;inset:0;z-index:30;display:none;padding:14px 14px 90px}
  body.showd .detail{display:block}
  body.showd{overflow:hidden}
  .back{display:inline-flex}
  .top .stand{display:none}
}
</style>
</head>
<body>
<div class="top">
  <h1>Verhaal</h1>
  <span class="stand" id="stand">Laden…</span>
  <input id="q" type="search" placeholder="Zoek scène, NPC, monster…" autocomplete="off">
  <button class="btn" id="fNu" title="Toon alleen wat nog moet">Enkel open</button>
  <button class="btn" id="fSb" title="Alle statblokken">Statblokken</button>
  <button class="btn" id="reload" title="Nieuwste versie ophalen">↻</button>
  <span class="pill" id="sync">…</span>
  <a class="btn" href="../" title="Terug naar de tracker">Tracker</a>
</div>
<div class="layout">
  <nav class="list" id="list"><div class="empty">Laden…</div></nav>
  <main class="detail" id="detail"><div class="empty">Kies links een scène.</div></main>
</div>
<script>
'use strict';
var D=null, SB={}, SEL=null, Q='', ONLYOPEN=false, SBMODE=false;
var LS_CACHE='odl-verhaal-cache', LS_ST='odl-verhaal-status', LS_UI='odl-verhaal-ui', LS_CHK='odl-verhaal-chk', LS_HP='odl-verhaal-hp';
function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var ST=lsGet(LS_ST,{}), UI=lsGet(LS_UI,{open:{},fork:{}}), CHK=lsGet(LS_CHK,{}), HP=lsGet(LS_HP,{});
UI.open=UI.open||{};UI.fork=UI.fork||{};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function pill(cls,t){var e=$('sync');e.className='pill '+cls;e.textContent=t;}

var STLBL={klaar:'Gespeeld',nu:'Nu',open:'Open',optie:'Optioneel',later:'Later',skip:'Overgeslagen'};
var TYLBL={gevecht:'gevecht',sociaal:'sociaal',val:'val',keuze:'keuze',beloning:'beloning',reis:'reis',verkenning:'verkenning',kerker:'kerker',onderzoek:'onderzoek',quest:'quest',info:'info',graf:'graf',verhaal:'verhaal'};

/* ---------- laden ---------- */
function ghCfg(){var c=lsGet('odl-gh-cfg',{});return {owner:c.owner||'jorisdekimpe',token:c.token||''};}
function srcUrl(){var m=location.search.match(/[?&]src=([^&]+)/);return m?decodeURIComponent(m[1]):null;}
function fetchStory(){
  var s=srcUrl(), c=ghCfg();
  if(s) return fetch(s,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
  if(c.token){
    return fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/odl-data/contents/verhaal.json?ref=main',
      {headers:{'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('GitHub '+r.status);return r.text();});
  }
  return fetch('https://raw.githubusercontent.com/'+encodeURIComponent(c.owner)+'/odl-data/main/verhaal.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
}
function useStory(txt,fromCache){
  D=JSON.parse(txt);
  D.byId={};D.scenes.forEach(function(s,i){s._i=i;D.byId[s.id]=s;});
  D.gById={};D.groepen.forEach(function(g){D.gById[g.id]=g;});
  D.held={};D.spelers.forEach(function(p){D.held[p.held]=p;});
  $('stand').textContent=D.meta.stand+' · bijgewerkt '+D.meta.bijgewerkt+(fromCache?' (offline kopie)':'');
  renderList();
  var h=location.hash.slice(1);
  if(h&&D.byId[h]) select(h,true); else if(!SEL){var f=D.scenes.find(function(s){return status(s)==='nu';}); if(f&&window.innerWidth>900) select(f.id,true); scrollToRow(f&&f.id);}
  else if(SEL&&D.byId[SEL]) renderDetail();
}
function load(){
  pill('','Ophalen…');
  Promise.all([
    fetch('statblokken.json').then(function(r){return r.json();}).then(function(j){SB=j;}).catch(function(){}),
    fetchStory().then(function(t){JSON.parse(t);try{localStorage.setItem(LS_CACHE,t);}catch(e){}return t;})
  ]).then(function(res){useStory(res[1],false);pill('ok','Actueel');})
  .catch(function(err){
    var t=null;try{t=localStorage.getItem(LS_CACHE);}catch(e){}
    if(t){useStory(t,true);pill('warn','Offline');}
    else{pill('err','Niet geladen');$('list').innerHTML='<div class="empty">Kon het verhaal niet laden: '+esc(err.message)+'</div>';}
  });
}

/* ---------- status ---------- */
function status(s){return ST[s.id]||s.status;}
function setStatus(id,v){var s=D.byId[id];if(v===s.status)delete ST[id];else ST[id]=v;lsSet(LS_ST,ST);renderList();renderDetail();}

/* ---------- zoeken ---------- */
function hay(s){
  if(s._h)return s._h;
  var p=[s.titel,s.waar,s.kern,s.wanneer,s.kop];
  ['zeg','doen','buit','dm','open'].forEach(function(k){(s[k]||[]).forEach(function(x){p.push(x);});});
  (s.dialoog||[]).forEach(function(d){p.push(d.wie);(d.kern||[]).forEach(function(x){p.push(x);});});
  (s.haken||[]).forEach(function(h){p.push(h.h,h.t);});
  (s.vijanden||[]).forEach(function(v){p.push(v.naam,v.noot,(SB[v.k]||{}).n);});
  return s._h=p.join(' ').toLowerCase();
}
function visible(s){
  var st=status(s);
  if(ONLYOPEN&&(st==='klaar'||st==='skip'))return false;
  if(Q&&hay(s).indexOf(Q)<0)return false;
  return true;
}

/* ---------- lijst ---------- */
function rowHtml(s){
  var st=status(s), tags='';
  if(s.ster)tags+='<span class="tag ster">★</span>';
  var nf=(s.vijanden||[]).reduce(function(a,v){return a+(v.q||1);},0);
  if(s.type&&s.type!=='verhaal')tags+='<span class="tag '+esc(s.type)+'">'+esc(TYLBL[s.type]||s.type)+'</span>';
  if(nf&&s.type!=='gevecht')tags+='<span class="tag gevecht">⚔ '+nf+'</span>';
  if(ST[s.id])tags+='<span class="tag lok" title="Lokaal aangepast">●</span>';
  return '<button class="row '+st+(SEL===s.id?' sel':'')+'" data-id="'+esc(s.id)+'" id="r-'+esc(s.id)+'"><span class="dot '+st+'"></span><span class="rt"><div class="rn">'+esc(s.titel)+'</div>'+(s.waar?'<div class="rw">'+esc(s.waar)+'</div>':'')+'</span><span class="rb">'+tags+'</span></button>';
}
function groupBody(g,sc){
  var h='',kop=null;
  sc.forEach(function(s){if(s.kop&&s.kop!==kop){kop=s.kop;h+='<div class="kop">'+esc(kop)+'</div>';}h+=rowHtml(s);});
  return h;
}
function counts(sc){var d=sc.filter(function(s){var t=status(s);return t==='klaar'||t==='skip';}).length;return d+'/'+sc.length;}
function isOpen(key,def){return UI.open[key]===undefined?def:UI.open[key];}
function renderList(){
  if(!D)return;
  if(SBMODE){renderSbList();return;}
  var h='', any=false;
  D.aktes.forEach(function(a){
    var gs=D.groepen.filter(function(g){return g.akte===a.id;});
    var all=D.scenes.filter(function(s){return D.gById[s.groep].akte===a.id;});
    var vis=all.filter(visible); if(!vis.length)return; any=true;
    var hasNu=all.some(function(s){var t=status(s);return t==='nu'||t==='open';});
    var ao=Q?true:isOpen('a:'+a.id,a.id==='A1'||hasNu&&a.id!=='P');
    h+='<section class="act"><button data-tog="a:'+esc(a.id)+'">'+(ao?'▾':'▸')+' '+esc(a.titel)+'<span class="cnt">'+counts(all)+'</span></button>';
    if(ao){
      var i=0;
      while(i<gs.length){
        var g=gs[i];
        if(g.fork){
          var fg=[];while(i<gs.length&&gs[i].fork===g.fork){fg.push(gs[i]);i++;}
          if(Q){fg.forEach(function(x){var xs=D.scenes.filter(function(s){return s.groep===x.id&&visible(s);});if(xs.length)h+='<div class="grp"><div class="gh"><div class="gt">'+esc(x.titel)+'</div></div>'+groupBody(x,xs)+'</div>';});continue;}
          var cur=UI.fork[g.fork]||fg[0].id; if(!fg.some(function(x){return x.id===cur;}))cur=fg[0].id;
          var cg=D.gById[cur], csc=D.scenes.filter(function(s){return s.groep===cur&&visible(s);});
          var call=D.scenes.filter(function(s){return s.groep===cur;});
          h+='<div class="grp"><div class="fork"><div class="fl">Volgende labour — wissel:</div><div class="ft">'+fg.map(function(x){
            var xs=D.scenes.filter(function(s){return s.groep===x.id;});
            return '<button class="btn s'+(x.id===cur?' on':'')+'" data-fork="'+esc(g.fork)+'" data-g="'+esc(x.id)+'">'+esc(x.tab||x.titel)+' <span style="opacity:.7">'+counts(xs)+'</span></button>';}).join('')+'</div></div>';
          h+='<button class="gh" data-tog="g:'+esc(cur)+'"><div class="gt">'+esc(cg.titel)+'<span class="cnt">'+counts(call)+'</span></div>'+(cg.sub?'<div class="gs">'+esc(cg.sub)+'</div>':'')+'</button>';
          if(Q||isOpen('g:'+cur,true))h+=groupBody(cg,csc);
          h+='</div>';
          continue;
        }
        var sc=D.scenes.filter(function(s){return s.groep===g.id;}), sv=sc.filter(visible);
        i++; if(!sv.length)continue;
        var go=Q?true:isOpen('g:'+g.id,!g.dicht);
        h+='<div class="grp'+(g.grof?' grof':'')+'"><button class="gh" data-tog="g:'+esc(g.id)+'"><div class="gt">'+(go?'▾':'▸')+' '+esc(g.titel)+'<span class="cnt">'+counts(sc)+'</span></div>'+(g.sub?'<div class="gs">'+esc(g.sub)+'</div>':'')+'</button>';
        if(go)h+=groupBody(g,sv);
        h+='</div>';
      }
    }
    h+='</section>';
  });
  $('list').innerHTML=any?h:'<div class="empty">Niets gevonden.</div>';
}
function scrollToRow(id){if(!id)return;var e=$('r-'+id);if(e)e.scrollIntoView({block:'center'});}

$('list').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tog){var k=b.dataset.tog;var g=k.slice(2),def=k[0]==='a'?(g==='A1'):!(D.gById[g]&&D.gById[g].dicht);UI.open[k]=!isOpen(k,def);lsSet(LS_UI,UI);renderList();return;}
  if(b.dataset.fork){UI.fork[b.dataset.fork]=b.dataset.g;lsSet(LS_UI,UI);renderList();return;}
  if(b.dataset.id){if(SBMODE){showSb(b.dataset.id);return;}select(b.dataset.id);}
});

/* ---------- detail ---------- */
function select(id,noScroll){
  SEL=id;history.replaceState(null,'','#'+id);
  document.querySelectorAll('.row.sel').forEach(function(e){e.classList.remove('sel');});
  var r=$('r-'+id);if(r)r.classList.add('sel');
  renderDetail();document.body.classList.add('showd');$('detail').scrollTop=0;
  if(!noScroll)scrollToRow(id);
}
function txt(t){
  t=esc(t);
  return t.replace(/^Voorstel: /,'<span class="voorstel">voorstel</span>');
}
function ul(a){return '<ul>'+a.map(function(x){return '<li>'+txt(x)+'</li>';}).join('')+'</ul>';}
function sec(cls,title,body){return '<div class="sec '+cls+'"><h3>'+title+'</h3>'+body+'</div>';}
function renderDetail(){
  if(!D||!SEL||!D.byId[SEL])return;
  var s=D.byId[SEL], st=status(s), g=D.gById[s.groep], h='';
  h+='<div class="dh"><button class="btn back" id="back">← Lijst</button><h2>'+(s.ster?'★ ':'')+esc(s.titel)+'</h2></div>';
  h+='<div class="dmeta">'+(s.waar?'<span><b>Waar</b> '+esc(s.waar)+'</span>':'')+'<span><b>Groep</b> '+esc(g.titel)+(s.kop?' · '+esc(s.kop):'')+'</span>'+(s.type?'<span><b>Type</b> '+esc(TYLBL[s.type]||s.type)+'</span>':'')+'</div>';
  h+='<div class="stat">'+['nu','open','klaar','optie','skip'].map(function(k){return '<button class="btn '+k+(st===k?' on':'')+'" data-st="'+k+'">'+STLBL[k]+'</button>';}).join('')+(ST[s.id]?'<button class="btn" data-st="'+esc(s.status)+'" title="Terug naar de status uit het bestand">↺ '+esc(STLBL[s.status])+'</button>':'')+'</div>';
  if(s.wanneer)h+=sec('kern','Wanneer','<p>'+txt(s.wanneer)+'</p>');
  if(s.kern)h+=sec('kern','Scène','<p>'+txt(s.kern)+'</p>');
  if(s.zeg&&s.zeg.length)h+=sec('zeg','Moet je zeker vertellen',ul(s.zeg));
  if(s.dialoog&&s.dialoog.length)h+=sec('dia','Belangrijke dialogen',s.dialoog.map(function(d){return '<div class="dlg"><div class="who">'+esc(d.wie)+'</div>'+ul(d.kern||[])+'</div>';}).join(''));
  if(s.doen&&s.doen.length){
    var c=CHK[s.id]||{};
    h+=sec('doen','Interacties en checks','<ul class="chk">'+s.doen.map(function(x,i){return '<li class="'+(c[i]?'done':'')+'"><input type="checkbox" data-chk="'+i+'"'+(c[i]?' checked':'')+'><span>'+txt(x)+'</span></li>';}).join('')+'</ul>');
  }
  if(s.vijanden&&s.vijanden.length)h+=sec('vij','Vijanden en statblokken',s.vijanden.map(function(v,i){return foeHtml(s,v,i);}).join(''));
  if(s.buit&&s.buit.length)h+=sec('buit','Buit',ul(s.buit));
  if(s.haken&&s.haken.length)h+=sec('haken','Haken per held',s.haken.map(function(k){var p=D.held[k.h];return '<div class="hk"><div class="hn">'+esc(k.h)+(p?'<small>'+esc(p.speler)+' · '+esc(p.pad)+'</small>':'')+'</div><div class="ht">'+txt(k.t)+'</div></div>';}).join(''));
  if(s.dm&&s.dm.length)h+=sec('dm','Enkel voor de DM',ul(s.dm));
  if(s.open&&s.open.length)h+=sec('open','Nog te beslissen',ul(s.open));
  if(s.bron)h+='<div class="src">Bron: '+esc(s.bron)+'</div>';
  var prev=D.scenes[s._i-1], next=D.scenes[s._i+1];
  h+='<div class="nav">'+(prev?'<button class="btn" data-go="'+esc(prev.id)+'">← '+esc(prev.titel)+'</button>':'<span></span>')+(next?'<button class="btn" data-go="'+esc(next.id)+'">'+esc(next.titel)+' →</button>':'')+'</div>';
  $('detail').innerHTML=h;
}
function hpKey(s,i){return s.id+':'+i;}
function foeHtml(s,v,i){
  var b=SB[v.k], q=v.q||1, name=v.naam||(b?b.n:v.k);
  var h='<div class="foe"><button class="fh" data-sb="'+i+'"><span class="fn">'+esc(name)+(v.naam&&b?' <span style="font-weight:400;color:var(--text3)">('+esc(b.n)+')</span>':'')+'</span><span class="fq">×'+q+'</span>'+(b?'<span class="fs">AC '+esc(String(b.ac).split(' ')[0])+' · HP '+esc(String(b.hp).split(' ')[0])+' · CR '+esc(cr(b))+'</span>':'<span class="fs">geen statblok</span>')+'</button>';
  if(v.noot)h+='<div class="fnote">'+txt(v.noot)+'</div>';
  if(b&&b.hpn>1){
    var arr=HP[hpKey(s,i)]||[];h+='<div class="hpbar">';
    for(var n=0;n<Math.min(q,16);n++){var val=arr[n]==null?b.hpn:arr[n];h+='<span class="hpbox"><span>'+(n+1)+'</span><button data-hp="'+i+'" data-n="'+n+'" data-d="-5">−</button><input inputmode="numeric" data-hpi="'+i+'" data-n="'+n+'" value="'+val+'" class="'+(val<=0?'dead':'')+'"><button data-hp="'+i+'" data-n="'+n+'" data-d="5">+</button></span>';}
    h+='<button class="btn s" data-hpr="'+i+'">reset</button></div>';
  }
  h+='<div class="sbwrap" id="sb-'+i+'" style="display:none">'+(b?sbHtml(b):'')+'</div></div>';
  return h;
}
function cr(b){var c=(b.x||[]).find(function(x){return x[0]==='Challenge';});return c?c[1].split(' ')[0]:'—';}
function mod(n){var m=Math.floor((n-10)/2);return (m>=0?'+':'')+m;}
function sbHtml(b){
  var h='<div class="sb"><div class="sbn">'+esc(b.n)+'</div><div class="sbm">'+esc(b.m)+'</div><hr>';
  h+='<p><b>Armor Class</b> '+esc(b.ac)+'</p><p><b>Hit Points</b> '+esc(b.hp)+'</p><p><b>Speed</b> '+esc(b.spd)+'</p><hr>';
  h+='<div class="abil">'+['STR','DEX','CON','INT','WIS','CHA'].map(function(a,i){return '<div><b>'+a+'</b>'+b.ab[i]+' ('+mod(b.ab[i])+')</div>';}).join('')+'</div><hr>';
  (b.x||[]).forEach(function(x){h+='<p><b>'+esc(x[0])+'</b> '+esc(x[1])+'</p>';});
  if(b.tr&&b.tr.length){h+='<hr>';b.tr.forEach(function(t){h+='<p><b><i>'+esc(t[0])+'.</i></b> '+esc(t[1]).replace(/\n/g,'<br>')+'</p>';});}
  [['ac_','Actions'],['bo','Bonus Actions'],['re','Reactions'],['le','Legendary Actions']].forEach(function(k){var l=b[k[0]];if(l&&l.length){h+='<h4>'+k[1]+'</h4>';l.forEach(function(t){h+='<p><b><i>'+esc(t[0])+'.</i></b> '+esc(t[1]).replace(/\n/g,'<br>')+'</p>';});}});
  if(b.note)h+='<div class="note">'+esc(b.note)+'</div>';
  h+='<div class="ssrc">'+esc(b.src||'')+'</div></div>';
  return h;
}
$('detail').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.id==='back'){document.body.classList.remove('showd');scrollToRow(SEL);return;}
  if(b.dataset.st){setStatus(SEL,b.dataset.st);return;}
  if(b.dataset.go){select(b.dataset.go);return;}
  if(b.dataset.sb!==undefined){var w=$('sb-'+b.dataset.sb);if(w)w.style.display=w.style.display==='none'?'block':'none';return;}
  if(b.dataset.hp!==undefined){var s=D.byId[SEL],i=+b.dataset.hp,n=+b.dataset.n,bb=SB[s.vijanden[i].k];var k=hpKey(s,i);var arr=HP[k]||[];var cur=arr[n]==null?bb.hpn:arr[n];arr[n]=Math.max(-99,cur+(+b.dataset.d));HP[k]=arr;lsSet(LS_HP,HP);var inp=document.querySelector('input[data-hpi="'+i+'"][data-n="'+n+'"]');if(inp){inp.value=arr[n];inp.className=arr[n]<=0?'dead':'';}return;}
  if(b.dataset.hpr!==undefined){var s2=D.byId[SEL];delete HP[hpKey(s2,+b.dataset.hpr)];lsSet(LS_HP,HP);renderDetail();var w2=$('sb-'+b.dataset.hpr);return;}
});
$('detail').addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset.chk!==undefined){var c=CHK[SEL]||{};if(t.checked)c[t.dataset.chk]=1;else delete c[t.dataset.chk];CHK[SEL]=c;lsSet(LS_CHK,CHK);t.parentNode.className=t.checked?'done':'';}
  if(t.dataset.hpi!==undefined){var s=D.byId[SEL],i=+t.dataset.hpi,n=+t.dataset.n,k=hpKey(s,i);var arr=HP[k]||[];arr[n]=parseInt(t.value,10)||0;HP[k]=arr;lsSet(LS_HP,HP);t.className=arr[n]<=0?'dead':'';}
});

/* ---------- statblokken-modus ---------- */
function renderSbList(){
  var keys=Object.keys(SB).sort(function(a,b){return SB[a].n.localeCompare(SB[b].n);});
  if(Q)keys=keys.filter(function(k){return (SB[k].n+' '+SB[k].m+' '+(SB[k].note||'')).toLowerCase().indexOf(Q)>=0;});
  var used={};D.scenes.forEach(function(s){(s.vijanden||[]).forEach(function(v){(used[v.k]=used[v.k]||[]).push(s.titel);});});
  $('list').innerHTML='<div class="grp"><div class="gh"><div class="gt">Statblokken<span class="cnt">'+keys.length+'</span></div><div class="gs">Tik voor het volledige blok.</div></div>'+keys.map(function(k){var b=SB[k];return '<button class="row" data-id="'+esc(k)+'"><span class="rt"><div class="rn">'+esc(b.n)+'</div><div class="rw">CR '+esc(cr(b))+' · AC '+esc(String(b.ac).split(' ')[0])+' · HP '+esc(String(b.hp).split(' ')[0])+(used[k]?' · '+used[k].length+'× in het verhaal':'')+'</div></span></button>';}).join('')+'</div>';
}
function showSb(k){
  var b=SB[k];if(!b)return;
  var used=D.scenes.filter(function(s){return (s.vijanden||[]).some(function(v){return v.k===k;});});
  $('detail').innerHTML='<div class="dh"><button class="btn back" id="back">← Lijst</button><h2>'+esc(b.n)+'</h2></div>'+sbHtml(b)+(used.length?'<div class="sec"><h3>Komt voor in</h3><ul>'+used.map(function(s){return '<li><a href="#'+esc(s.id)+'" data-go2="'+esc(s.id)+'">'+esc(s.titel)+'</a></li>';}).join('')+'</ul></div>':'');
  document.body.classList.add('showd');
}
document.addEventListener('click',function(ev){var a=ev.target.closest('[data-go2]');if(a){ev.preventDefault();SBMODE=false;$('fSb').classList.remove('on');renderList();select(a.dataset.go2);}});

/* ---------- topbalk ---------- */
var qT=null;
$('q').addEventListener('input',function(){clearTimeout(qT);var v=this.value;qT=setTimeout(function(){Q=v.trim().toLowerCase();renderList();},120);});
$('fNu').addEventListener('click',function(){ONLYOPEN=!ONLYOPEN;this.classList.toggle('on',ONLYOPEN);renderList();});
$('fSb').addEventListener('click',function(){SBMODE=!SBMODE;this.classList.toggle('on',SBMODE);renderList();});
$('reload').addEventListener('click',load);
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(D&&D.byId[h]&&h!==SEL)select(h);});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&D)load();});

if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){});}
load();
</script>
