<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>De Zeven — Speler</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F3ECDD">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('zs.thema'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --titel:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Noto Serif',serif;
  --tekst:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --grond:#F3ECDD; --vlak:#FBF7EE; --vlak2:#EFE6D3; --kaart:#FFFFFF;
  --lijn:#DED2BC; --lijn-sterk:#C9B99B;
  --inkt:#2A2520; --inkt2:#5C5247; --inkt3:#6E6254;
  --zee:#1F5560; --zee-op:#FBF7EE; --zee-bg:#E3EDEC;
  --nu:#9A6410; --nu-bg:#F6E3BD; --nu-bd:#E2C38A; --nu-tx:#3D2803;
  --goed:#2E7D4F; --goed-bg:#DDEBDD; --goed-tx:#24502F;
  --wacht:#B9770E;
  --fout:#A32D2D; --fout-bg:#FAEDE6; --fout-bd:#E6CFC4; --fout-tx:#7A2E17;
  --h-orelle:#B0432A; --h-kyrenos:#8F6208; --h-dragini:#6A4C93; --h-apollodorus:#2F6690;
  --h-sirius:#1C7568; --h-ox:#5B7A22; --h-wauros:#A23A6E; --h-op:#FFFFFF;
  --schaduw:0 8px 28px rgba(42,37,32,.22);
  --scrim:rgba(20,15,10,.55);
  --donker:#111416; --donker2:#22282B; --donker-lijn:#3A4246; --donker-tx:#EDE4D3; --donker-tx2:#A39886; --papier:#FFFFFF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --grond:#12181B; --vlak:#1A2226; --vlak2:#222C31; --kaart:#1F292E;
  --lijn:#2E3A40; --lijn-sterk:#46555C;
  --inkt:#EDE4D3; --inkt2:#C2B6A3; --inkt3:#A39886;
  --zee:#7FC1C4; --zee-op:#0E1F22; --zee-bg:#17303A;
  --nu:#E0A955; --nu-bg:#3A2C12; --nu-bd:#6A4E1E; --nu-tx:#F7E3BA;
  --goed:#6CC08F; --goed-bg:#1C3324; --goed-tx:#A9D9B5;
  --wacht:#E0A955;
  --fout:#F0908F; --fout-bg:#26191A; --fout-bd:#4A2C23; --fout-tx:#F2B7A2;
  --h-orelle:#F08C6E; --h-kyrenos:#E8B64E; --h-dragini:#B9A0E6; --h-apollodorus:#8DBDE6;
  --h-sirius:#74CDBE; --h-ox:#A9C96B; --h-wauros:#E991BE; --h-op:#12181B;
  --schaduw:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --grond:#12181B; --vlak:#1A2226; --vlak2:#222C31; --kaart:#1F292E;
    --lijn:#2E3A40; --lijn-sterk:#46555C;
    --inkt:#EDE4D3; --inkt2:#C2B6A3; --inkt3:#A39886;
    --zee:#7FC1C4; --zee-op:#0E1F22; --zee-bg:#17303A;
    --nu:#E0A955; --nu-bg:#3A2C12; --nu-bd:#6A4E1E; --nu-tx:#F7E3BA;
    --goed:#6CC08F; --goed-bg:#1C3324; --goed-tx:#A9D9B5;
    --wacht:#E0A955;
    --fout:#F0908F; --fout-bg:#26191A; --fout-bd:#4A2C23; --fout-tx:#F2B7A2;
    --h-orelle:#F08C6E; --h-kyrenos:#E8B64E; --h-dragini:#B9A0E6; --h-apollodorus:#8DBDE6;
    --h-sirius:#74CDBE; --h-ox:#A9C96B; --h-wauros:#E991BE; --h-op:#12181B;
    --schaduw:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--grond);color:var(--inkt)}
body{font-family:var(--tekst);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor}
svg.i.s{width:18px;height:18px}
:focus-visible{outline:2px solid var(--zee);outline-offset:2px}

/* kop */
.top{position:sticky;top:0;z-index:5;background:var(--grond);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--titel);font-size:22px;font-weight:700;color:var(--zee);line-height:1.15}
.top .sub{font-size:13px;color:var(--inkt2);display:flex;align-items:center}
.rond{width:44px;height:44px;border-radius:22px;border:1px solid var(--lijn);background:var(--vlak);color:var(--inkt2);display:grid;place-items:center;flex:none}
.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pil{min-height:44px;border-radius:22px;padding:0 14px;border:1px solid var(--lijn);background:var(--vlak);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--inkt2);white-space:nowrap;flex:none}
.pil .d{width:9px;height:9px;border-radius:50%;background:var(--goed);flex:none}
.pil.bezig .d{background:var(--wacht)}
.pil.fout{background:var(--fout-bg);border-color:var(--fout-bd);color:var(--fout-tx)} .pil.fout .d{background:var(--fout)}
.pil.offline .d{background:none;border:2px solid var(--inkt3)}
.pil.geen{border-style:dashed;border-color:var(--lijn-sterk)} .pil.geen .d{display:none}
.banner{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 16px;font-size:14px;line-height:1.4;border:0;border-bottom:1px solid var(--lijn);background:var(--vlak2);color:var(--inkt)}
.banner.fout{background:var(--fout-bg);border-bottom-color:var(--fout-bd);color:var(--fout-tx)}
.banner svg{margin-top:-1px}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.twee>div{background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:10px 12px;font-size:14px}
.twee ul{list-style:none;margin-top:4px}
.twee li{padding:2px 0}
.bladkop{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.bladkop h2{margin:0}
.meander{display:block;width:100%;height:12px}
.kopblok{position:sticky;top:0;z-index:5;background:var(--grond)}

/* opbouw */
main{max-width:720px;margin:0 auto;padding:14px 16px}
.sec{display:none}.sec.on{display:block}
h2{font-family:var(--titel);font-size:21px;font-weight:700;margin:20px 0 10px;color:var(--inkt);line-height:1.2}
h2:first-child{margin-top:4px}
h3{font-family:var(--titel);font-size:17px;font-weight:700;margin-bottom:2px;line-height:1.25}
.card,.kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.hero{background:var(--nu-bg);border-color:var(--nu-bd);color:var(--nu-tx)}
.card.hero .small,.card.hero .kicker{color:var(--nu-tx)}
.kicker,.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--inkt2);font-weight:700}
.muted{color:var(--inkt3);font-size:13px}
.small{font-size:13px;color:var(--inkt2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--vlak2);color:var(--inkt2);white-space:nowrap}
.chip.nu{background:var(--nu-bg);color:var(--nu-tx)} .chip.goed,.chip.g{background:var(--goed-bg);color:var(--goed-tx)}
.chip.fout,.chip.b{background:var(--fout-bg);color:var(--fout-tx)} .chip.zee,.chip.r{background:var(--zee-bg);color:var(--zee)}
.chip.kaart{background:var(--kaart);color:var(--inkt2)}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* knoppen en velden */
.knop,.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--lijn-sterk);background:var(--vlak);color:var(--inkt);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.knop.p,.btn.p{background:var(--zee);border-color:var(--zee);color:var(--zee-op)}
.knop.groot{min-height:56px;font-size:19px}
.knop.gevaar{color:var(--fout-tx);border-color:var(--fout-bd);background:var(--fout-bg)}
.knop.ok{background:var(--goed-bg);border-color:transparent;color:var(--goed-tx)}
.btn.s{padding:0 12px;font-size:14px}
.btn.g,.knop.g{background:none;border-color:transparent;color:var(--inkt2)}
.knop:disabled,.btn:disabled{opacity:.5}
.knop.vol{width:100%}
input,textarea,select,.veld{width:100%;min-height:48px;border:1px solid var(--lijn-sterk);border-radius:12px;background:var(--kaart);padding:0 14px;font-size:16px;color:var(--inkt)}
textarea{min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--inkt3)}
input:focus,textarea:focus{outline:2px solid var(--zee);outline-offset:-1px}
label.f{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--inkt2);margin:12px 0 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--vlak2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--inkt2)}
.seg button.on{background:var(--kaart);color:var(--zee);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.filt,.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;scrollbar-width:none}
.filt button,.filters button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--lijn-sterk);background:transparent;font-weight:600;color:var(--inkt2);white-space:nowrap;flex:none}
.filt button.on,.filters button.on{background:var(--zee);border-color:var(--zee);color:var(--zee-op)}
.rij{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--lijn)}
.rij:last-child{border-bottom:0}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--lijn-sterk);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--kaart);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"]{background:var(--zee)} .sw[aria-checked="true"] i{left:23px}
.sw:disabled{opacity:.45}

/* heldenavatar */
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--av);color:var(--h-op);font-family:var(--titel);font-weight:700;flex:none;line-height:1}

/* details */
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{transition:transform .15s;display:inline-flex;color:var(--inkt3)}
details[open]>summary .chev{transform:rotate(90deg)}
.steps{margin:10px 0 0 0;list-style:none}
.steps li{padding:5px 0 5px 24px;position:relative;font-size:14px}
.steps li::before{content:"";position:absolute;left:3px;top:11px;width:10px;height:10px;border:1.5px solid var(--zee);border-radius:2px;transform:rotate(45deg)}
.steps li.done::before{background:var(--zee)}

/* onderbalk */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--vlak);border-top:1px solid var(--lijn);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:max(16px,env(safe-area-inset-bottom))}
.nav button{background:none;border:0;border-top:3px solid transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--inkt2)}
.nav button.on{color:var(--zee);border-top-color:var(--zee);font-weight:700}

/* lijsten */
.search{margin-bottom:10px}
.npc .att{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.att.vriendelijk{background:var(--goed)} .att.vijandig{background:var(--fout)} .att.neutraal{background:var(--inkt2)} .att.onbekend{background:var(--inkt3)}
.lore{margin-top:10px;padding:10px 12px;background:var(--vlak2);border-radius:10px;font-family:var(--titel);font-size:16px;font-style:italic;color:var(--inkt2)}
.lore .kicker{font-family:var(--tekst);font-style:normal;display:block;margin-bottom:2px}
.note{margin-top:10px;border-top:1px dashed var(--lijn-sterk);padding-top:10px}
.note textarea{min-height:64px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:10px;text-align:center}
.stat .val{font-family:var(--titel);font-size:26px;font-weight:700;line-height:1.1;margin:2px 0}
.stat .val input{font-family:var(--titel);font-size:26px;font-weight:700;text-align:center;border:none;background:none;padding:0;width:4ch;min-height:40px}
.stat .ctl{display:flex;justify-content:center;gap:8px}
.stat .ctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--lijn-sterk);background:var(--kaart);font-size:18px}
.hpbar{height:8px;border-radius:4px;background:var(--vlak2);overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--goed)}
.item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--lijn)}
.item:last-child{border-bottom:none}
.item .nm{font-weight:600}
.item .qty{display:flex;align-items:center;gap:4px}
.item .qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--lijn-sterk);background:var(--kaart)}
.item .qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.ico{background:none;border:none;color:var(--inkt3);width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;flex:none}
.ico.on{color:var(--zee)}
.heroes{display:grid;grid-template-columns:1fr;gap:10px}
.heroes button{text-align:left;background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:10px 14px;min-height:66px;display:flex;align-items:center;gap:12px}
.heroes button b{display:block;font-size:17px}
.sheet{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 0;border-bottom:1px solid var(--lijn)}
.sheet:last-child{border-bottom:none}
.lock{font-size:12px;color:var(--zee)}
a{color:var(--zee)}
.empty{text-align:center;color:var(--inkt3);padding:18px 8px;font-size:15px}
.hide{display:none!important}

/* mijn held */
.tekstknop{background:none;border:0;color:var(--zee);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.hpgetal{background:none;border:0;display:flex;align-items:baseline;gap:6px;padding:0;min-height:56px;color:var(--inkt);text-align:left}
.hpgetal b{font-family:var(--titel);font-size:48px;line-height:1}
.hpgetal span{font-size:20px;color:var(--inkt2)}
.hpbar.dik{height:10px;border-radius:5px;margin-top:10px}
.hpknoppen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.hpknoppen .knop{padding:0}
.knop.stap{width:48px;padding:0}
.stapw{min-width:40px;text-align:center;font-family:var(--titel);font-size:22px}
.statrij{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.tegel{min-height:72px;border-radius:14px;border:1px solid var(--lijn);background:var(--vlak);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;color:var(--inkt)}
.tegel b{font-family:var(--titel);font-size:24px;line-height:1.1}
.tegel b small{font-family:var(--tekst);font-size:13px;color:var(--inkt2);font-weight:600}
.tegel[aria-pressed="true"]{background:var(--nu-bg);border-color:var(--nu-bd);color:var(--nu-tx)}
.tegel[aria-pressed="true"] .lbl{color:var(--nu-tx)}
.knop.vierkant{width:48px;min-height:48px;padding:0;flex:none}
.itemrij{width:100%;background:none;border:0;border-bottom:1px solid var(--lijn);text-align:left;display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 0;color:var(--inkt)}
.itemrij:last-child{border-bottom:0}
.itemrij .nm{display:block;font-size:16px;font-weight:600}
.itemrij .nt{display:block;font-size:13px;color:var(--inkt2)}
.itemrij .aant{color:var(--inkt2);font-weight:600;font-variant-numeric:tabular-nums}
.itemrij>svg{color:var(--inkt3)}
.rijknop{background:none;border:0;display:flex;align-items:center;gap:12px;text-align:left;color:var(--inkt);min-height:52px;text-decoration:none;padding:0}
.rijknop b{display:block;font-weight:600}
.rij.rijknop{width:100%}
.status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--inkt2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--inkt3);flex:none}
.status.goed i{background:var(--goed)} .status.wacht i{background:var(--wacht)} .status.fout{color:var(--fout-tx)} .status.fout i{background:var(--fout)} .status.geen i{background:none;border:1.5px solid var(--inkt3)}
.groot-veld{font-family:var(--titel);font-size:32px;min-height:64px;text-align:center;margin-top:8px}
.knoprij{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qtybig{display:flex;align-items:center;justify-content:center;gap:22px;margin:16px 0 8px}
.qtybig .knop{width:64px;min-height:56px;padding:0}
.qtybig div{text-align:center;min-width:70px}
.qtybig b{display:block;font-family:var(--titel);font-size:32px;line-height:1.1}
@keyframes licht{0%{background:var(--zee-bg)}100%{background:transparent}}
.licht{animation:licht 2s ease-out}

/* verhaal en party */
.kopknop{width:100%;background:none;border:0;display:flex;align-items:center;gap:12px;text-align:left;min-height:44px;padding:0;color:var(--inkt)}
.kopknop h3{margin:0}
.kopknop .muted{display:block}
.chev{display:inline-flex;color:var(--inkt3);transition:transform .15s}
.chev.open{transform:rotate(180deg)}
.qbody{margin-top:10px}
.kaart.waar{background:var(--nu-bg);border-color:var(--nu-bd);color:var(--nu-tx)}
.kaart.waar .lbl{color:var(--nu-tx)}
.kaart.waar h2{font-size:26px;margin:4px 0 6px;color:var(--nu-tx)}
.kaart.waar p{font-size:15px}
.kort{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;margin:6px 0 4px}
.recaplink{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;margin:14px 0 4px;font-weight:600;text-decoration:none}
.kaart.lijst{padding-top:4px;padding-bottom:4px}
.rij.buit{align-items:center}
.rij .nm{display:block;font-size:16px;font-weight:600}
.rij .nt{font-size:13px;color:var(--inkt2)}
.sub{gap:6px;font-size:13px;color:var(--inkt2);margin-top:2px;align-items:flex-start}
.sub .av{margin-top:-1px}
.rij.buit .knop{flex:none}
.prij{border-bottom:1px solid var(--lijn)}
.prij:last-child{border-bottom:0}
.prij>.kopknop{min-height:64px;padding:8px 0}
.prij .nm{display:block;font-size:16px;font-weight:600}
.prij .nt{display:block;font-size:13px;color:var(--inkt2)}
.phw{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:13px;color:var(--inkt2);white-space:nowrap}
.phw b{font-family:var(--titel);font-size:16px;color:var(--inkt)}
.mini{display:block;width:78px;height:6px;border-radius:3px;background:var(--vlak2);overflow:hidden}
.mini i{display:block;height:100%}
.pbody{padding:0 0 12px 52px}

/* NPC's */
.zoekveld{position:relative;margin-bottom:10px}
.zoekveld svg{position:absolute;left:14px;top:13px;color:var(--inkt3);pointer-events:none}
.zoekveld input{padding-left:44px;margin:0}

.keuze.on{border-color:var(--zee);color:var(--zee)}
.groepkop{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--inkt2);margin:16px 0 6px}
.npcrij{min-height:60px}
.npcrij .chip{vertical-align:2px;margin-left:4px}
.houding{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;text-transform:lowercase}
.houding.vriendelijk{color:var(--goed)} .houding.vijandig{color:var(--fout)} .houding.neutraal{color:var(--inkt2)} .houding.onbekend{color:var(--inkt3)}
.terug{min-height:44px;background:none;border:0;color:var(--zee);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:4px;margin-left:-6px;padding:0 6px}
.npcnaam{font-family:var(--titel);font-size:32px;line-height:1.1;margin-top:6px}
.lore2{background:var(--vlak2)}
.lore2 p{font-family:var(--titel);font-style:italic;font-size:17px;margin-top:4px;color:var(--inkt)}

/* gevecht */
.gevbalk{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 16px;border:0;border-bottom:1px solid var(--lijn);background:var(--zee-bg);color:var(--inkt);text-align:left;font-size:14px}
.gevbalk.nu{background:var(--nu-bg);color:var(--nu-tx);border-bottom-color:var(--nu-bd)}
.gevbalk .volg{display:inline-flex;align-items:center;gap:2px;font-weight:600;color:var(--zee);white-space:nowrap}
.gevbalk.nu .volg{color:var(--nu-tx)}
.gevecht,.instel{position:fixed;inset:0;z-index:25;background:var(--grond);display:none;overflow:auto}
.gevecht.on,.instel.on{display:block}
.instel{z-index:26}
.instel details>summary{list-style:none}
.instel details[open]>summary svg:last-child{transform:rotate(180deg)}
.gevin{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.rondeblok{background:var(--zee);color:var(--zee-op);border-radius:12px;width:76px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.rondeblok span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.rondeblok b{font-family:var(--titel);font-size:24px;line-height:1}
.volgorde{list-style:none;display:grid;gap:8px}
.volgorde li{display:flex;align-items:center;gap:12px;min-height:56px;border-radius:12px;padding:6px 12px;background:var(--vlak);border:1px solid var(--lijn)}
.volgorde li.cur{background:var(--zee-bg);border:2px solid var(--zee)}
.volgorde li.uit{opacity:.55}
.volgorde li.uit .nm{text-decoration:line-through}
.volgorde .nm{font-weight:600}
.ini{font-family:var(--titel);font-size:20px;min-width:28px;text-align:center}
.chip.curchip{background:var(--zee);color:var(--zee-op)}
.vijand-ic{width:36px;height:36px;border-radius:50%;background:var(--fout-bg);color:var(--fout);display:grid;place-items:center;flex:none}

/* kolommen: op telefoon een rij, volgorde via order */
.heldgrid{display:flex;flex-direction:column}
.heldgrid .kol{display:contents}
.heldgrid>.kol>div>h2:first-child{margin-top:20px}
.tabletje{display:none!important}

/* tablet */
@media (min-width:900px){
  body{padding-left:96px;padding-bottom:24px}

  .heldgrid .kol{display:block}

  .partygrid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
  .kaart.lijst.helden{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;background:none;border:0;padding:0;align-items:start}

  .helden .prij .phw{width:100%;flex-direction:row;justify-content:space-between;align-items:center}
  .helden .pbody{padding:0 0 10px}
  .tabletje{display:block!important}
  .buitkol>.row:first-child{margin-top:4px!important}
  .modal .box,.blad{max-width:560px;border-radius:20px;margin-bottom:auto;margin-top:auto}
  .modal{align-items:center}
}

/* blad (modal) */
.modal{position:fixed;inset:0;z-index:28;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}

.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:var(--grond);font-weight:700;text-decoration:underline;min-height:32px}

<script>
'use strict';
/* ============ basis ============ */
var DEFAULT_REPO='jorisdekimpe/odl-spelers';
var MAX_ATTUNE=3;
var D=null;               // spelers.json
var party={};             // id -> remote inventaris (Party-tab)
var partyAt=0;
var curTab=lsGet('zs.tab','verhaal');
var npcFilter='alle';

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('Opslaan op dit toestel mislukt');}}
var toastT,toastFn=null;function toast(m,lbl,fn,ms){var t=$('toast');toastFn=fn||null;t.innerHTML='<span>'+esc(m)+'</span>'+(lbl?'<button onclick="toastActie()">'+esc(lbl)+'</button>':'');t.setAttribute('role','status');t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');toastFn=null;},ms||2600);}
function toastActie(){var f=toastFn;toastFn=null;$('toast').classList.remove('on');if(f)f();}
function typing(){var a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
function ago(t){if(!t)return'nooit';var s=Math.round((now()-t)/1000);if(s<60)return'net nu';if(s<3600)return Math.round(s/60)+' min geleden';if(s<86400)return Math.round(s/3600)+' u geleden';return new Date(t).toLocaleDateString('nl-BE',{day:'numeric',month:'short'});}

var IC={
  verhaal:'<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h11"/>',
  npcs:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  held:'<path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/>',
  party:'<circle cx="12" cy="7" r="3"/><circle cx="5.5" cy="9.5" r="2.2"/><circle cx="18.5" cy="9.5" r="2.2"/><path d="M6.5 20a5.5 5.5 0 0 1 11 0M1.5 18.5a4 4 0 0 1 5.5-3.7M22.5 18.5a4 4 0 0 0-5.5-3.7"/>',
  instellingen:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  gevecht:'<path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/>',
  ververs:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  offline:'<path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"/>',
  letop:'<path d="M12 3 2 21h20zM12 10v5M12 18h.01"/>',
  toestel:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  slot:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  ster:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  bestand:'<path d="M6 3h8l5 5v13H6zM14 3v5h5"/>',
  foto:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  sleutel:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',
  oog:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  vinkje:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  rechts:'<path d="M9 6l6 6-6 6"/>', links:'<path d="M15 6l-6 6 6 6"/>', omlaag:'<path d="M6 9l6 6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', min:'<path d="M5 12h14"/>', kruis:'<path d="M6 6l12 12M18 6 6 18"/>',
  zoek:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  vriendelijk:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  vijandig:'<path d="M12 3l9 9-9 9-9-9z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>',
  neutraal:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  onbekend:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14M12 17h.01"/>',
  bewerk:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  wis:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  meer:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  extern:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'
};
function ic(n,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||'')+'</svg>';}
var ICON={lock:ic('slot','s'),star:ic('ster','s'),starOn:ic('ster','s f'),edit:ic('bewerk','s'),del:ic('wis','s')};
var HIDS=['orelle','kyrenos','dragini','apollodorus','sirius','ox','wauros'];
function av(id,size){if(HIDS.indexOf(id)<0)return '';size=size||40;return '<span class="av" aria-hidden="true" style="--av:var(--h-'+id+');width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.46)+'px">'+id.charAt(0).toUpperCase()+'</span>';}
function heroByName(nm){if(!D||!nm)return null;var n=String(nm).toLowerCase().trim();for(var i=0;i<D.helden.length;i++){var h=D.helden[i],full=h.naam.toLowerCase();if(n===h.id||n===full||n===full.split(' ')[0]||full.split(' ').indexOf(n)>=0)return h;}return null;}
function datumLang(d){var t=new Date(d);return isNaN(t)?String(d||''):t.toLocaleDateString('nl-BE',{day:'numeric',month:'long'});}

/* ============ thema ============ */
function thema(){return lsGet('zs.thema','system');}
function isDonker(){var t=thema();return t==='dark'||(t!=='light'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function pasThemaToe(){var t=thema(),r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',getComputedStyle(r).getPropertyValue('--grond').trim());}
function zetThema(t){lsSet('zs.thema',t);pasThemaToe();document.querySelectorAll('[data-thema]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-thema')===t);});}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',pasThemaToe);}catch(e){}
var TABS=[['verhaal','Verhaal','verhaal'],['npcs',"NPC's",'npcs'],['held','Mijn held','held'],['party','Party','party']];
function bouwNav(){$('nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" onclick="tab(\''+t[0]+'\')">'+ic(t[2])+'<span>'+t[1]+'</span></button>';}).join('');$('cfgBtn').innerHTML=ic('instellingen');}


/* ============ held / sync-config ============ */
function heroId(){return lsGet('zs.held',null);}
function isDM(){return heroId()==='dm';}
function heroInfo(id){if(!D)return null;for(var i=0;i<D.helden.length;i++)if(D.helden[i].id===id)return D.helden[i];return null;}
function syncCfg(){return lsGet('zs.sync',{repo:DEFAULT_REPO,token:''});}
function syncOn(){var c=syncCfg();return !!(c.token&&c.repo);}

/* ============ inventaris-model (mergebaar) ============ */
/* fields: {key:{v,t}}  items/sheets: [{id,t,del?,...}] */
function blankInv(id){return {held:id,f:{},items:[],sheets:[],updated:0};}
function inv(){var id=heroId();if(!id||id==='dm')return null;var x=lsGet('zs.inv.'+id,null);if(!x){x=blankInv(id);}return x;}
function saveInv(x,skipPush){x.updated=now();lsSet('zs.inv.'+x.held,x);lsSet('zs.dirty.'+x.held,true);if(!skipPush)schedulePush();}
function fv(x,k,d){return x&&x.f&&x.f[k]?x.f[k].v:d;}
function setF(x,k,v){x.f[k]={v:v,t:now()};}
function mergeList(a,b){var m={};(a||[]).forEach(function(o){m[o.id]=o;});(b||[]).forEach(function(o){if(!m[o.id]||(o.t||0)>(m[o.id].t||0))m[o.id]=o;});return Object.keys(m).map(function(k){return m[k];}).sort(function(p,q){return (p.c||0)-(q.c||0);});}
function merge(a,b){
  if(!a)return b; if(!b)return a;
  var f={},k;for(k in a.f)f[k]=a.f[k];for(k in b.f){if(!f[k]||b.f[k].t>f[k].t)f[k]=b.f[k];}
  return {held:a.held||b.held,f:f,items:mergeList(a.items,b.items),sheets:mergeList(a.sheets,b.sheets),updated:Math.max(a.updated||0,b.updated||0)};
}
function same(a,b){return JSON.stringify(strip(a))===JSON.stringify(strip(b));}
function strip(x){if(!x)return x;return {f:x.f,items:x.items,sheets:(x.sheets||[]).map(function(s){return {id:s.id,t:s.t,del:s.del,path:s.path,name:s.name,type:s.type,c:s.c};})};}

/* ============ GitHub ============ */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
function gh(path,opt){
  var c=syncCfg();opt=opt||{};
  var h={'Accept':opt.raw?'application/vnd.github.raw':'application/vnd.github+json','Authorization':'Bearer '+c.token};
  if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+c.repo+'/contents/'+path+(opt.method?'':'?t='+now()),{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
}
function ghGetJson(path){
  return gh(path).then(function(r){
    if(r.status===404)return {data:null,sha:null};
    if(!r.ok){var e=new Error('GitHub '+r.status);e.status=r.status;throw e;}
    return r.json().then(function(j){return {data:JSON.parse(b64dec(j.content)),sha:j.sha};});
  });
}
function ghPutRaw(path,b64,sha,msg){
  return gh(path,{method:'PUT',body:{message:msg,content:b64,sha:sha||undefined}}).then(function(r){
    if(!r.ok)return r.text().then(function(t){var e=new Error('GitHub '+r.status);e.status=r.status;e.body=t;throw e;});
    return r.json();
  });
}
function ghSha(path){return gh(path).then(function(r){if(r.status===404)return null;if(!r.ok){var e=new Error('GitHub '+r.status);e.status=r.status;throw e;}return r.json().then(function(j){return j.sha;});});}
function ghDelete(path){return ghSha(path).then(function(sha){if(!sha)return;return gh(path,{method:'DELETE',body:{message:'Verwijder '+path,sha:sha}});});}

function setSync(state,detail){SYNC={state:state,detail:detail||null,t:now()};lsSet('zs.syncState',SYNC);if(state==='ok')lsSet('zs.lastSync',now());toonSync();}
function tijdKort(t){if(!t)return 'nog nooit';var d=new Date(t),n=new Date();var u=d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});return d.toDateString()===n.toDateString()?u:datumLang(t)+', '+u;}
function agoLang(t){if(!t)return 'nog nooit';var s=Math.round((now()-t)/1000);if(s<60)return 'net nu';var m=Math.round(s/60);if(m<60)return m+(m===1?' minuut':' minuten')+' geleden';var h=Math.round(m/60);if(h<24)return h+' uur geleden';return datumLang(t);}

function toonSync(){
  var st=syncState(),pil=$('pil');if(!pil)return;
  pil.className='pil '+st;$('pilTx').textContent=PILTX[st];
  var last=lsGet('zs.lastSync',0);
  pil.setAttribute('aria-label','Sync: '+PILTX[st].toLowerCase().replace('…','')+(syncOn()?', laatst bewaard '+agoLang(last):''));

  if(st==='fout')b.innerHTML='<button class="banner fout" role="alert" onclick="openSync()">'+ic('letop','s')+'<span><b>Niet bewaard op GitHub.</b> '+esc(FOUTKORT[code]||FOUTKORT.gh)+' Je wijzigingen staan veilig op dit toestel.</span></button>';

function schedulePush(){if(!syncOn())return;clearTimeout(pushT);pushT=setTimeout(syncOwn,2500);if(navigator.onLine&&SYNC.state!=='fout')setSync('bezig');}
function syncOwn(){
  var x=inv();if(!x||!syncOn())return Promise.resolve();
  if(busy){schedulePush();return Promise.resolve();}
  if(!navigator.onLine){toonSync();return Promise.resolve();}
  busy=true;if(SYNC.state!=='fout')setSync('bezig');
  var path='inventaris/'+x.held+'.json',needRender=false;
  return uploadPendingSheets(x).then(function(){
    x=inv();
    return ghGetJson(path);
  }).then(function(rem){
    var m=merge(x,rem.data);
    var changed=!same(m,rem.data);
    if(!same(m,x))needRender=true;
    if(heroId()===x.held){lsSet('zs.inv.'+x.held,m);}
    if(!changed){lsSet('zs.dirty.'+x.held,false);return;}
    var info=heroInfo(x.held);
    return ghPutRaw(path,b64enc(JSON.stringify(m,null,1)),rem.sha,'Inventaris '+(info?info.naam:x.held)).then(function(){lsSet('zs.dirty.'+x.held,false);});
  }).then(function(){busy=false;setSync('ok');if(needRender&&curTab==='held'&&!typing())renderHeld();},function(e){
    busy=false;
    if(e&&e.status===409){schedulePush();return;}
    if(!navigator.onLine){toonSync();return;}
    setSync('fout',{code:errCode(e),status:e&&e.status||0});
  });
}

/* ============ sheets (IndexedDB) ============ */
var idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise(function(res,rej){var r=indexedDB.open('zs-sheets',1);r.onupgradeneeded=function(){r.result.createObjectStore('f');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return idbP;}
function idbPut(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});}
var memBlobs={};
function idbGet(k){if(memBlobs[k])return Promise.resolve(memBlobs[k]);return idb().then(function(db){return new Promise(function(res){var t=db.transaction('f');var q=t.objectStore('f').get(k);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbDel(k){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=res;t.onerror=res;});});}
function blobB64(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.onerror=rej;r.readAsDataURL(b);});}
function shrinkImage(file,maxZ,kw){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var M=maxZ||2000,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){res(b||file);},'image/jpeg',kw||.85);};
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}
function pickSheet(){$('fileIn').value='';$('fileIn').click();}
function sniff(f){return f.slice(0,8).arrayBuffer().then(function(buf){var u=new Uint8Array(buf),t=String.fromCharCode.apply(null,u.subarray(0,5));if(t==='%PDF-')return 'pdf';if(u[0]===0xFF&&u[1]===0xD8)return 'img';if(u[0]===0x89&&u[1]===0x50)return 'img';return null;}).catch(function(){return null;});}
function onSheetFile(el){
  var f=el.files&&el.files[0];if(!f)return;var x=inv();if(!x)return;
  sniff(f).then(function(kind){
    var isPdf=kind==='pdf'||f.type==='application/pdf'||/\.pdf$/i.test(f.name);
    var isImg=!isPdf&&(kind==='img'||/^image\//.test(f.type));
    if(!isPdf&&!isImg){toast('Dit bestand herken ik niet als PDF of foto');return;}
    return (isPdf?Promise.resolve(f):shrinkImage(f)).then(function(b){
      if(b.size>8*1024*1024){toast('Bestand te groot ('+(b.size/1048576).toFixed(1)+' MB, max 8 MB)');return;}
      var id=uid(),ext=isPdf?'pdf':'jpg',key=x.held+'/'+id;
      var s={id:id,c:now(),t:now(),name:(f.name||'').replace(/\.[^.]+$/,'')||'Sheet',type:isPdf?'pdf':'img',path:'sheets/'+x.held+'/'+id+'.'+ext,up:false};
      return idbPut(key,b).catch(function(){memBlobs[key]=b;}).then(function(){x=inv();x.sheets.push(s);saveInv(x);renderHeld();toast(syncOn()?'Sheet toegevoegd':'Sheet toegevoegd op dit toestel');});
    });
  }).catch(function(e){toast('Toevoegen mislukt: '+((e&&e.message)||e));});
}
function sheetErr(e){if(!e)return 'onbekende fout';if(e.status===413)return 'te groot voor GitHub';if(e.status===401||e.status===403)return 'sleutel geweigerd';if(e.status===422)return 'GitHub weigerde het bestand';return e.message||String(e);}
function markSheet(held,sid,fn){var y=inv();if(!y||y.held!==held)return;y.sheets.forEach(function(q){if(q.id===sid)fn(q);});lsSet('zs.inv.'+y.held,y);}
function uploadPendingSheets(x){
  var todo=(x.sheets||[]).filter(function(s){return !s.del&&!s.up&&!s.err;});
  var gone=(x.sheets||[]).filter(function(s){return s.del&&s.up&&!s.gone;});
  var p=Promise.resolve(),fails=[];
  todo.forEach(function(s){p=p.then(function(){return idbGet(x.held+'/'+s.id);}).then(function(b){
    if(!b){markSheet(x.held,s.id,function(q){q.err='bestand staat niet meer op dit toestel, verwijder en upload opnieuw';});fails.push(s.name);return;}
    return blobB64(b).then(function(b64){return ghSha(s.path).then(function(sha){return ghPutRaw(s.path,b64,sha,'Sheet '+s.name);});})
      .then(function(){markSheet(x.held,s.id,function(q){q.up=true;delete q.err;q.t=now();});delete memBlobs[x.held+'/'+s.id];})
      .catch(function(e){markSheet(x.held,s.id,function(q){q.err=sheetErr(e);q.errc=e&&e.status||0;});fails.push(s.name);});
  });});
  gone.forEach(function(s){p=p.then(function(){return ghDelete(s.path);}).then(function(){markSheet(x.held,s.id,function(q){q.gone=true;q.t=now();});}).catch(function(){});});
  return p.then(function(){if(todo.length&&curTab==='held'&&!typing())renderHeld();if(bladOpen==='sync')renderSyncBlad();});
}
function retrySheet(sid){var x=inv();x.sheets.forEach(function(s){if(s.id===sid){delete s.err;delete s.errc;}});lsSet('zs.inv.'+x.held,x);if(curTab==='held')renderHeld();if(syncOn())syncOwn();}
function teGroot(s){return s.errc===413||/te groot/.test(s.err||'');}
function verklein(sid){
  var x=inv(),s=null;x.sheets.forEach(function(q){if(q.id===sid)s=q;});if(!s)return;var key=x.held+'/'+sid;
  idbGet(key).then(function(b){if(!b)throw new Error('Het bestand staat niet meer op dit toestel.');if(s.type!=='img')throw new Error('Een PDF kan ik niet verkleinen. Maak er foto’s van of bewaar hem kleiner.');return shrinkImage(b,1600,.7);})
  .then(function(b){return idbPut(key,b).catch(function(){memBlobs[key]=b;});}).then(function(){retrySheet(sid);toast('Verkleind, opnieuw proberen');})
  .catch(function(e){toast(e.message);});
}
function loadSheetBlob(owner,s){
  return idbGet(owner+'/'+s.id).then(function(b){
    if(b)return b;
    if(!syncOn())throw new Error('Niet op dit toestel en geen sync');
    return gh(s.path,{raw:true}).then(function(r){if(!r.ok)throw new Error('GitHub '+r.status);return r.blob();}).then(function(b){return idbPut(owner+'/'+s.id,b).then(function(){return b;});});
  });
}

var vState={scale:1,doc:null,url:null,kind:null};
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};s.onerror=function(){rej(new Error('PDF-lezer kon niet laden (offline?)'));};document.head.appendChild(s);});
}
function openSheet(owner,sid){
  var x=owner===heroId()?inv():party[owner];if(!x)return;
  var s=null;x.sheets.forEach(function(q){if(q.id===sid)s=q;});if(!s)return;
  ovOpen();$('vTitle').textContent=s.name;$('vBody').innerHTML='<div class="empty">Laden…</div>';$('viewer').classList.add('on');

    if(s.type==='img'){vState.url=URL.createObjectURL(b);renderViewer();return;}
    return loadPdfJs().then(function(lib){return b.arrayBuffer().then(function(buf){return lib.getDocument({data:buf}).promise;});}).then(function(doc){vState.doc=doc;renderViewer();});
  }).catch(function(e){$('vBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>';});

  body.innerHTML='';var doc=vState.doc,dpr=window.devicePixelRatio||1,p=Promise.resolve();
  for(var i=1;i<=doc.numPages;i++)(function(n){p=p.then(function(){return doc.getPage(n);}).then(function(pg){var v0=pg.getViewport({scale:1}),sc=W/v0.width,vp=pg.getViewport({scale:sc*dpr});var c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=W+'px';body.appendChild(c);return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;});})(i);
}

/* ============ buit met geheugen ============ */
function slug(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function buitNaam(b){return String(b.item).replace(/\s*×\d+$/,'');}
function buitN(b){var m=String(b.item).match(/×(\d+)$/);return m?+m[1]:0;}
function buitSleutel(b){if(b.id)return b.id;var nm=buitNaam(b),dub=D.buit.filter(function(c){return buitNaam(c)===nm;}).length>1;return 'b:'+slug(nm)+(dub?'~'+slug(b.bron):'');}
function migreerBuit(){
  var x=inv();if(!x||!D)return;var ch=false;
  D.buit.forEach(function(b){var k=buitSleutel(b),nm=buitNaam(b);x.items.forEach(function(it){if(!it.buit&&!it.del&&it.notitie==='Van: '+b.bron&&it.naam===nm){it.buit=k;it.t=now();ch=true;}});});
  /* tweede ronde: buit die bij jou ligt en die je zelf al met dezelfde naam had ingevoerd */
  D.buit.forEach(function(b){if(!buitBij(b).ik)return;var k=buitSleutel(b),nm=buitNaam(b).toLowerCase();if(heeftBuit(x,k))return;for(var i=0;i<x.items.length;i++){var it=x.items[i];if(!it.buit&&!it.del&&String(it.naam).trim().toLowerCase()===nm){it.buit=k;it.t=now();ch=true;break;}}});
  if(ch)saveInv(x);
}
function buitBij(b){var me=heroInfo(heroId()),h=heroByName(b.bij);if(h)return {held:h,ik:!!me&&me.id===h.id};var t=String(b.bij||'').toLowerCase();return {held:null,ik:false,groep:t==='party'||t.indexOf('iedereen')===0};}
function heeftBuit(x,k){var n=0;if(x)x.items.forEach(function(it){if(it.buit===k&&!it.del)n+=num(it.aantal,1);});return n;}
var buitAlles=false;
function buitRij(b,i){
  var x=inv(),k=buitSleutel(b),bij=buitBij(b),N=buitN(b),heb=heeftBuit(x,k),knop='';
  var mag=!!x&&(bij.ik||bij.groep);
  if(mag){
    var vol=N?heb>=N:heb>0;
    knop=vol?'<button class="knop ok" onclick="toonBuitItem(\''+esc(k)+'\')">'+ic('vinkje','s')+'In je inventaris</button>':'<button class="knop p" onclick="neemBuit('+i+')">'+(N?'Neem 1':'Neem')+'</button>';
  }
  var sub=bij.held?(av(bij.held.id,22)+'<span>'+(bij.ik?'Bij jou':'Bij '+esc(bij.held.naam.split(' ')[0]))+' · '+esc(b.bron)+'</span>'):'<span>'+(bij.groep&&String(b.bij).toLowerCase()==='party'?'Party':esc(b.bij.charAt(0).toUpperCase()+b.bij.slice(1)))+' · '+esc(b.bron)+'</span>';
  if(mag&&N)sub+='<span>· jij hebt er '+heb+'</span>';
  return '<div class="rij buit"><span class="grow"><span class="nm">'+esc(b.item)+'</span><span class="row sub">'+sub+'</span></span>'+knop+'</div>';
}
function neemBuit(i){
  var x=inv();if(!x){tab('held');return;}var b=D.buit[i],k=buitSleutel(b),N=buitN(b),nm=buitNaam(b),bestaand=null;
  x.items.forEach(function(it){if(it.buit===k&&!it.del)bestaand=it;});
  if(N&&bestaand){bestaand.aantal=num(bestaand.aantal,1)+1;bestaand.t=now();}
  else if(bestaand){toonBuitItem(k);return;}
  else x.items.push({id:uid(),c:now(),t:now(),naam:nm,aantal:1,notitie:'Van: '+b.bron,buit:k});
  saveInv(x);renderParty();toast(nm+' in je inventaris');
}
function toonBuitItem(k){var x=inv(),id=null;if(x)x.items.forEach(function(it){if(it.buit===k&&!it.del)id=it.id;});tab('held');if(!id)return;setTimeout(function(){var e=$('it-'+id);if(!e)return;e.scrollIntoView({block:'center'});e.classList.remove('licht');void e.offsetWidth;e.classList.add('licht');},60);}

var NF=[['alle','Alle'],['ontmoet','Ontmoet'],['bij naam','Bij naam'],['dood','Dood']];
var HOUD=[['alle','Alle'],['vriendelijk','Vriendelijk'],['vijandig','Vijandig'],['neutraal','Neutraal'],['onbekend','Onbekend']];
var GROEP=[['sessie','Per sessie'],['plek','Per plek'],['az','A–Z']];
var npcHouding=lsGet('zs.npcHouding','alle'),npcGroep=lsGet('zs.npcGroep','sessie'),npcSel=null;
function houdingHtml(h){h=h||'onbekend';return '<span class="houding '+esc(h)+'">'+ic(IC[h]?h:'onbekend','s')+esc(h)+'</span>';}
function sessieNr(n){var m=String(n.eerst||'').match(/(\d+)/);return m?+m[1]:0;}
function plekKort(n){var w=String(n.waar||'').split(' —')[0].split(' (')[0].split(',')[0].trim();return (!w||w==='—')?'Geen vaste plek':w;}
function npcZoekTekst(n,notes){return (n.naam+' '+n.wie+' '+(n.lore||'')+' '+n.waar+' '+(notes[n.naam]||'')).toLowerCase();}
function renderNpcs(){
  if(!D)return;
  var breed=isBreed();$('s-npcs').classList.toggle('naast',breed&&!!npcSel);
  if(npcSel){$('npcPagina').classList.remove('hide');renderNpcPagina();if(!breed){$('npcLijst').classList.add('hide');return;}}
  else{$('npcPagina').classList.add('hide');$('npcPagina').innerHTML='';}
  $('npcLijst').classList.remove('hide');
  var cnt={};D.npcs.forEach(function(n){cnt[n.status]=(cnt[n.status]||0)+1;});
  $('npcF').innerHTML=NF.map(function(f){return '<button class="'+(npcFilter===f[0]?'on':'')+'" aria-pressed="'+(npcFilter===f[0])+'" onclick="npcFilter=\''+f[0]+'\';renderNpcs()">'+f[1]+' '+(f[0]==='alle'?D.npcs.length:(cnt[f[0]]||0))+'</button>';}).join('');
  var hl=HOUD.filter(function(h){return h[0]===npcHouding;})[0]||HOUD[0],gl=GROEP.filter(function(g){return g[0]===npcGroep;})[0]||GROEP[0];
  $('npcK').innerHTML='<button class="keuze'+(npcHouding!=='alle'?' on':'')+'" onclick="keuzeBlad(\'houding\')">Houding: '+esc(hl[1].toLowerCase())+ic('omlaag','s')+'</button><button class="keuze" onclick="keuzeBlad(\'groep\')">'+esc(gl[1])+ic('omlaag','s')+'</button>';
  var q=($('npcQ').value||'').toLowerCase().trim(),notes=lsGet('zs.npcnotes',{});
  var L=D.npcs.filter(function(n){
    if(npcFilter!=='alle'&&n.status!==npcFilter)return false;
    if(npcHouding!=='alle'&&(n.houding||'onbekend')!==npcHouding)return false;
    if(q&&npcZoekTekst(n,notes).indexOf(q)<0)return false;return true;
  });
  if(!L.length){$('npcList').innerHTML='<div class="empty">'+(q?'Niemand gevonden voor “'+esc(q)+'”.<br><button class="knop" style="margin-top:10px" onclick="$(\'npcQ\').value=\'\';renderNpcs()">Wis zoekterm</button>':'Niemand in deze selectie.')+'</div>';return;}
  var groepen=[],idx={};
  function g(k,label,sort){if(!idx[k]){idx[k]={k:k,label:label,sort:sort,L:[]};groepen.push(idx[k]);}return idx[k];}
  L.forEach(function(n){
    if(npcGroep==='sessie'){var s=sessieNr(n);g('s'+s,s?'Sessie '+s:'Onbekend',-s).L.push(n);}
    else if(npcGroep==='plek'){var p=plekKort(n);g('p'+p,p,p==='Geen vaste plek'?'zzz':p.toLowerCase()).L.push(n);}
    else{var l=n.naam.charAt(0).toUpperCase();g('a'+l,l,l).L.push(n);}
  });
  groepen.sort(function(a,b){return a.sort<b.sort?-1:a.sort>b.sort?1:0;});
  if(npcGroep==='az')groepen.forEach(function(x){x.L.sort(function(a,b){return a.naam.localeCompare(b.naam,'nl');});});
  $('npcList').innerHTML=groepen.map(function(x){
    return '<div class="groepkop">'+esc(x.label)+' · '+x.L.length+'</div><div class="kaart lijst">'+x.L.map(function(n){
      var st=n.status==='dood'?' <span class="chip fout">dood</span>':n.status==='bij naam'?' <span class="chip">bij naam</span>':'';
      return '<button class="itemrij npcrij'+(n.naam===npcSel?' sel':'')+'"'+(n.naam===npcSel?' aria-current="true"':'')+' onclick="openNpc(D.npcs['+D.npcs.indexOf(n)+'].naam)"><span class="grow"><span class="nm">'+esc(n.naam)+st+'</span><span class="nt">'+esc(n.waar&&n.waar!=='—'?n.waar:'Geen vaste plek')+'</span></span>'+houdingHtml(n.houding)+'</button>';
    }).join('')+'</div>';
  }).join('');
}

    if(bad.length)o.push('<div class="kaart" style="margin-top:12px;background:var(--kaart)"><span class="lbl">Sheets niet geüpload</span>'+bad.map(function(q){return '<div class="rij"><span class="grow"><b>'+esc(q.name)+'</b><br><span class="small">'+esc(q.err)+'</span></span>'+(teGroot(q)&&q.type==='img'?'<button class="knop" onclick="verklein(\''+q.id+'\')">Verklein</button>':'<button class="knop" onclick="retrySheet(\''+q.id+'\')">Opnieuw</button>')+'</div>';}).join('')+'</div>');
    o.push('<div class="twee"><div><span class="lbl">Op GitHub</span><ul><li>HP en stats</li><li>Inventaris</li><li>Sheets</li></ul></div><div><span class="lbl">Enkel dit toestel</span><ul><li>Notities</li><li>NPC-notities</li></ul><span class="muted">Zit in je back-up via Instellingen.</span></div></div>');
    o.push('<div style="display:grid;gap:10px"><button class="knop p vol" onclick="syncOwn().then(function(){return pullParty();})">'+ic('ververs','s')+'Opnieuw proberen</button><button class="knop vol" onclick="closeModal();openSettings()">'+(code==='sleutel'?'Tafelcode invoeren':'Koppeling nakijken')+'</button></div>');
  }
  $('modalBox').innerHTML=o.join('');
}
/* ============ instellingen (volledig scherm) ============ */
var instOpen=false;
function openSettings(code){instOpen=true;$('instel').classList.add('on');document.body.style.overflow='hidden';renderInstel(code);ovOpen();}
function sluitInstel(){if(!instOpen)return;instOpen=false;$('instel').classList.remove('on');document.body.style.overflow='';render();}
function renderInstel(code){
  var c=syncCfg(),hid=heroId(),h=heroInfo(hid),o=[];
  o.push('<div class="row" style="margin-bottom:6px"><h1 class="npcnaam grow" style="margin:0">Instellingen</h1><button class="knop p" onclick="sluitInstel()">Klaar</button></div>');
  o.push('<div class="groepkop">Jouw held</div><div class="kaart"><div class="row" style="gap:12px">'+(isDM()?'<span class="vijand-ic" style="background:var(--nu-bg);color:var(--nu-tx)">'+ic('oog','s')+'</span><span class="grow"><b>DM-modus</b></span><button class="knop" onclick="stopDM();renderInstel()">Stop</button>':h?av(h.id,44)+'<span class="grow"><b style="display:block">'+esc(h.naam)+'</b><span class="small">'+esc(h.speler)+' · '+esc(kortKlasse(h.klasse))+'</span></span><button class="knop" onclick="wisselHeld()">Wissel</button>':'<span class="grow small" style="font-size:15px">Nog geen held gekozen.</span><button class="knop p" onclick="wisselHeld()">Kies</button>')+'</div></div>');
  o.push('<div class="groepkop">Koppelen met de tafel</div><div class="kaart">');
  if(syncOn()){
    o.push('<div class="row" style="gap:10px">'+ic('link')+'<span class="grow"><b style="display:block">Gekoppeld met de tafel</b><span class="small">Bewaard '+esc(agoLang(lsGet('zs.lastSync',0)))+'</span></span><button class="knop" onclick="clearCfg()">Ontkoppel</button></div>');
  }else{
    o.push('<label class="f" for="tcode" style="margin-top:0">Tafelcode van de DM</label><input id="tcode" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="bv. zwijn-hoorn-meander" value="'+esc(code||'')+'" onkeydown="if(event.key===\'Enter\')koppel()"><p class="small" style="margin-top:8px">Drie woorden, die de DM aan tafel zegt of in de groepschat zet. Je hoeft niets te plakken.</p><p id="tmsg" class="small" style="margin-top:6px" role="status"></p><button class="knop p groot vol" style="margin-top:10px" onclick="koppel()">Koppel</button>');
  }
  o.push('</div>');
  o.push('<div class="groepkop">Weergave</div><div class="seg">'+[['system','Systeem'],['light','Licht'],['dark','Donker']].map(function(t){return '<button data-thema="'+t[0]+'" class="'+(thema()===t[0]?'on':'')+'" onclick="zetThema(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>');
  o.push('<div class="groepkop">Back-up</div><div class="kaart"><p class="small" style="font-size:14px">Met HP, inventaris, notities en NPC-notities. Handig bij een nieuw toestel.</p><div class="knoprij"><button class="knop" onclick="exportAll()">Exporteer alles</button><button class="knop" onclick="importAll()">Importeer</button></div></div>');
  o.push('<div class="groepkop">Geavanceerd</div><div class="kaart lijst"><details'+(syncOn()?'':'')+'><summary class="rij rijknop">'+ic('sleutel','s')+'<span class="grow" style="font-weight:600">Sleutel plakken</span>'+ic('omlaag','s')+'</summary><div style="padding-bottom:12px"><label class="f" for="cfgTok">Sleutel</label><input id="cfgTok" type="password" autocomplete="off" value="'+esc(c.token)+'" placeholder="github_pat_…"><label class="f" for="cfgRepo">Repo</label><input id="cfgRepo" autocapitalize="off" value="'+esc(c.repo)+'"><p id="cfgMsg" class="small" style="margin-top:6px" role="status"></p><button class="knop vol" style="margin-top:8px" onclick="saveCfg()">Bewaar en test</button></div></details>');
  o.push('<button class="rij rijknop vol" onclick="dmBlad()">'+ic('oog','s')+'<span class="grow" style="font-weight:600">Ik ben de DM</span>'+ic('rechts','s')+'</button></div>');
  o.push('<p class="muted" style="text-align:center;margin:18px 0 8px">Verhaal bijgewerkt '+(D?esc(datumLang(D.bijgewerkt)):'—')+'</p>');
  $('instelBody').innerHTML=o.join('');
}
function wisselHeld(){lsSet('zs.held',null);sluitInstel();tab('held');}
function b64buf(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function normCode(v){return String(v||'').trim().toLowerCase().replace(/[\s_.,]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');}
var koppelBezig=false;
function koppel(){
  if(koppelBezig)return;
  var code=normCode($('tcode').value),m=$('tmsg');
  if(code.split('-').length<3){m.style.color='var(--fout-tx)';m.textContent='Een tafelcode heeft drie woorden, zoals zwijn-hoorn-meander.';return;}
  if(!window.crypto||!crypto.subtle){m.style.color='var(--fout-tx)';m.textContent='Deze browser kan niet koppelen met een code. Gebruik Sleutel plakken onder Geavanceerd.';return;}
  koppelBezig=true;m.style.color='';m.textContent='Koppelen…';
  fetch('koppel.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw {k:'geen'};return r.json();}).then(function(k){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64buf(k.salt),iterations:k.iter||600000},base,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64buf(k.iv)},key,b64buf(k.data));}).catch(function(){throw {k:'code'};});
  }).then(function(buf){
    var j=JSON.parse(new TextDecoder().decode(buf));
    return fetch('https://api.github.com/repos/'+j.repo,{headers:{'Authorization':'Bearer '+j.token,'Accept':'application/vnd.github+json'}}).then(function(r){
      if(!r.ok)throw {k:'sleutel'};
      lsSet('zs.sync',{repo:j.repo,token:j.token});setSync('ok');
      koppelBezig=false;renderInstel();toast('Gekoppeld met de tafel');syncOwn().then(pullParty);gevHaal();
    },function(){throw {k:'net'};});
  }).catch(function(e){
    koppelBezig=false;var k=e&&e.k;m.style.color='var(--fout-tx)';
    m.textContent=k==='code'?'Die code klopt niet. Kijk de woorden na.':k==='geen'?'Er is nog geen tafelcode gemaakt. Vraag het de DM.':k==='sleutel'?'De code klopt, maar de sleutel erachter werkt niet meer. Vraag de DM een nieuwe code.':'Geen verbinding. Probeer het opnieuw als je online bent.';
  });
}
function leesCodeUitLink(){var m=String(location.hash||'').match(/code=([^&]+)/);if(!m)return;var code=normCode(decodeURIComponent(m[1]));try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}if(!syncOn())setTimeout(function(){openSettings(code);},50);}
function saveCfg(){
  var c={token:$('cfgTok').value.trim(),repo:($('cfgRepo').value||DEFAULT_REPO).trim()};lsSet('zs.sync',c);
  $('cfgMsg').textContent='Testen…';
  fetch('https://api.github.com/repos/'+c.repo,{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}}).then(function(r){
    if(r.ok)return r.json().then(function(j){if(j.permissions&&!j.permissions.push){$('cfgMsg').textContent='Gekoppeld, maar deze sleutel mag niet schrijven.';return;}$('cfgMsg').textContent='Gekoppeld.';setSync('ok');syncOwn().then(pullParty);gevHaal();setTimeout(function(){if(instOpen)renderInstel();},900);});
    $('cfgMsg').textContent=r.status===404?'De opslag is niet gevonden of de sleutel heeft er geen toegang toe.':'GitHub weigert deze sleutel.';setSync('fout',{code:r.status===404?'repo':'sleutel',status:r.status});
  },function(){$('cfgMsg').textContent='Geen verbinding.';});
}
function clearCfg(){lsSet('zs.sync',{repo:DEFAULT_REPO,token:''});SYNC={state:'ok'};lsSet('zs.syncState',SYNC);GEV=null;toonSync();toonGevecht();closeModal();if(instOpen)renderInstel();render();}
function vandaag(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function exportAll(){var x=inv();if(!x){toast('Kies eerst een held');return;}var o={v:1,held:x.held,inventaris:x,notities:lsGet('zs.notes.'+x.held,''),npcNotities:lsGet('zs.npcnotes',{}),thema:thema(),gemaakt:now()};var b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='de-zeven-'+x.held+'-'+vandaag()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Back-up bewaard');}
var IMP=null;
function importAll(){var i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=function(){var f=i.files[0];if(!f)return;f.text().then(function(t){
  var y=JSON.parse(t),x=inv(),nieuw=!!(y&&y.v&&y.inventaris),iv=nieuw?y.inventaris:y,held=nieuw?y.held:y.held;
  if(!x){toast('Kies eerst een held');return;}
  if(!iv||held!==x.held){toast('Dit bestand hoort bij een andere held');return;}
  saveInv(merge(x,iv));
  if(!nieuw){closeModal();renderHeld();toast('Teruggezet');return;}
  var ln=lsGet('zs.notes.'+x.held,''),lnpc=lsGet('zs.npcnotes',{}),conf=false;
  if(y.notities&&ln&&ln!==y.notities)conf=true;
  Object.keys(y.npcNotities||{}).forEach(function(k){if(lnpc[k]&&y.npcNotities[k]&&lnpc[k]!==y.npcNotities[k])conf=true;});
  IMP={held:x.held,y:y};
  if(!conf){impNotities(true);return;}
  $('modalBox').innerHTML='<div class="greep" aria-hidden="true"></div><h2 style="margin-top:0">Notities vervangen of houden?</h2><p class="small" style="font-size:15px">Je inventaris is teruggezet. Op dit toestel staan al notities die verschillen van de back-up.</p><div class="knoprij"><button class="knop" onclick="impNotities(false)">Houden</button><button class="knop p" onclick="impNotities(true)">Vervangen</button></div>';
  openModal('import');
}).catch(function(){toast('Dit bestand kan ik niet lezen');});};i.click();}
function impNotities(vervang){var o=IMP;IMP=null;if(!o)return;var y=o.y,ln=lsGet('zs.notes.'+o.held,''),lnpc=lsGet('zs.npcnotes',{});
  if(y.notities&&(!ln||vervang))lsSet('zs.notes.'+o.held,y.notities);
  Object.keys(y.npcNotities||{}).forEach(function(k){if(y.npcNotities[k]&&(!lnpc[k]||vervang))lnpc[k]=y.npcNotities[k];});lsSet('zs.npcnotes',lnpc);
  closeModal();render();toast('Back-up teruggezet');}
function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
function dmBlad(){$('modalBox').innerHTML='<div class="greep" aria-hidden="true"></div><h2 style="margin-top:0">DM-modus</h2><p class="small" style="font-size:15px">Enkel voor de DM. Je ziet dan alle inventarissen, ook privé-items, en alle sheets.</p><input id="dmP" class="groot-veld" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="DM-pincode" placeholder="Pincode" onkeydown="if(event.key===\'Enter\')askDM()"><p id="dmM" class="small" style="margin-top:6px;color:var(--fout-tx)"></p><div class="knoprij"><button class="knop" onclick="closeModal()">Annuleer</button><button class="knop p" onclick="askDM()">Open</button></div>';openModal('dm');setTimeout(function(){var e=$('dmP');if(e)e.focus();},60);}
function askDM(){var p=($('dmP')&&$('dmP').value||'').trim();if(!p)return;sha256('zeven:'+p).then(function(h){if(D&&h===D.dmPinHash){lsSet('zs.held','dm');closeModal();sluitInstel();toast('DM-modus aan');tab('party');}else{$('dmM').textContent='Die code klopt niet.';$('dmP').select();}});}
function stopDM(){lsSet('zs.held',null);render();toast('DM-modus uit');}

function agoS(t){var s=Math.max(0,Math.round((now()-t)/1000));return s<60?s+' s geleden':ago(t);}
/* ============ gevecht volgen ============ */
var GEV=null,gevEtag='',gevT=null,gevOpen=false,gevAt=0,gevVolgendeWasIk=false;
function gevActief(){return !!(GEV&&GEV.actief&&GEV.volgorde&&GEV.volgorde.length&&(!GEV.bijgewerkt||now()-GEV.bijgewerkt<6*3600*1000));}
function gevPlan(){clearTimeout(gevT);if(!syncOn()||document.hidden)return;gevT=setTimeout(gevHaal,gevActief()?4000:20000);}
function gevHaal(){
  clearTimeout(gevT);
  if(!syncOn()||document.hidden||!navigator.onLine){gevPlan();return Promise.resolve();}
  var c=syncCfg(),h={'Accept':'application/vnd.github.raw','Authorization':'Bearer '+c.token};if(gevEtag)h['If-None-Match']=gevEtag;
  return fetch('https://api.github.com/repos/'+c.repo+'/contents/gevecht.json',{headers:h,cache:'no-store'}).then(function(r){
    gevAt=now();
    if(r.status===304)return;
    if(r.status===404){gevEtag='';GEV=null;return;}
    if(!r.ok)return;
    gevEtag=r.headers.get('ETag')||'';
    return r.json().then(function(j){GEV=j;});
  }).catch(function(){}).then(function(){toonGevecht();gevPlan();});
}
function gevMijnIdx(){var me=heroId();if(!GEV||!me||me==='dm')return -1;for(var i=0;i<GEV.volgorde.length;i++)if(GEV.volgorde[i].held===me)return i;return -1;}
function gevVolgende(){var v=GEV.volgorde,n=v.length,b=num(GEV.beurt,0);for(var k=1;k<=n;k++){var j=(b+k)%n;if(!v[j].uit)return j;}return -1;}
function gevNaam(x){if(x.held){var h=heroInfo(x.held);return h?h.naam.split(' ')[0]:x.held;}return x.naam||'?';}
function toonGevecht(){
  var el=$('gevbalk');if(!el)return;
  if(!syncOn()||!gevActief()){el.innerHTML='';if(gevOpen)sluitGevecht();gevVolgendeWasIk=false;return;}
  var v=GEV.volgorde,b=num(GEV.beurt,0),cur=v[b],mi=gevMijnIdx(),vi=gevVolgende(),me=heroId();
  var ikNu=mi>=0&&mi===b,ikNa=mi>=0&&mi===vi&&!ikNu;
  if(ikNa&&!gevVolgendeWasIk&&lsGet('zs.tril',false)&&navigator.vibrate)try{navigator.vibrate(200);}catch(e){}
  gevVolgendeWasIk=ikNa;
  var tx;
  if(!me||me==='dm'||mi<0)tx='Ronde '+esc(GEV.ronde)+' · nu: <b>'+esc(cur?gevNaam(cur):'—')+'</b>';
  else if(ikNu)tx='<b>Jij bent aan de beurt</b> · ronde '+esc(GEV.ronde);
  else tx='Nu: <b>'+esc(cur?gevNaam(cur):'—')+'</b> · daarna: <b>'+(ikNa?'jij':esc(vi>=0?gevNaam(v[vi]):'—'))+'</b>';
  el.innerHTML='<button class="gevbalk'+(ikNu?' nu':'')+'" onclick="openGevecht()">'+ic('gevecht','s')+'<span class="grow">'+tx+'</span><span class="volg">Volgorde'+ic('rechts','s')+'</span></button>';
  if(gevOpen)renderGevecht();
}
function openGevecht(){gevOpen=true;$('gevecht').classList.add('on');document.body.style.overflow='hidden';renderGevecht();ovOpen();gevHaal();}
function sluitGevecht(){gevOpen=false;$('gevecht').classList.remove('on');document.body.style.overflow='';}
function renderGevecht(){
  if(!gevActief()){$('gevBody').innerHTML='<div class="empty">Het gevecht is voorbij.</div>';return;}
  var v=GEV.volgorde,b=num(GEV.beurt,0),mi=gevMijnIdx(),vi=gevVolgende(),cur=v[b];
  var st=mi>=0&&mi===b?'Jij bent aan de beurt.':mi>=0&&mi===vi?'Jij bent hierna. Nu is '+gevNaam(cur)+' aan de beurt.':'';
  var o=['<div class="row" style="align-items:flex-start;gap:12px"><button class="knop" onclick="sluitGevecht()" aria-label="Sluiten">'+ic('kruis','s')+'Sluiten</button><span class="grow"></span><div class="rondeblok"><span>Ronde</span><b>'+esc(GEV.ronde)+'</b></div></div>'];
  o.push('<h1 class="npcnaam" style="margin:14px 0 10px">Gevecht</h1>');
  if(st)o.push('<div class="kaart" style="background:var(--nu-bg);border-color:var(--nu-bd);color:var(--nu-tx);font-weight:600">'+esc(st)+'</div>');
  o.push('<ol class="volgorde">'+v.map(function(x,i){
    var isCur=i===b,isMe=i===mi,av_=x.held?av(x.held,36):x.kant==='bondgenoot'?'<span class="av" style="--av:var(--vlak2);color:var(--inkt);width:36px;height:36px;font-size:16px">'+esc(String(x.naam||'?').charAt(0).toUpperCase())+'</span>':'<span class="vijand-ic">'+ic('vijandig','s')+'</span>';
    return '<li class="'+(isCur?'cur ':'')+(x.uit?'uit':'')+'"'+(isCur?' aria-current="step"':'')+'><b class="ini">'+esc(x.init)+'</b>'+av_+'<span class="grow nm">'+esc(gevNaam(x))+(isMe?' <span class="muted">(jij)</span>':'')+(x.uit?' <span class="muted">uitgeschakeld</span>':'')+'</span>'+(isCur?'<span class="chip curchip">Aan de beurt</span>':isMe&&i===vi?'<span class="chip nu">Jij · hierna</span>':'')+'</li>';
  }).join('')+'</ol>');
  if('vibrate' in navigator)o.push('<div class="rij" style="margin-top:12px"><span class="grow"><b>Tril als ik hierna ben</b></span>'+sw(lsGet('zs.tril',false),"lsSet('zs.tril',!lsGet('zs.tril',false));renderGevecht()",'Tril als ik hierna ben')+'</div>');
  o.push('<p class="muted" style="margin-top:12px">Volgt de DM-tracker · bijgewerkt '+(gevAt?agoS(gevAt):'—')+'. Geen HP: die houdt de DM bij.</p>');
  $('gevBody').innerHTML=o.join('');
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')gevHaal();else clearTimeout(gevT);});

function loadData(){
  return fetch('spelers.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){D=d;lsSet('zs.data',d);},function(){D=lsGet('zs.data',null);if(!D)$('s-verhaal').innerHTML='<div class="empty">Geen verbinding en nog niets opgeslagen.</div>';});
}
pasThemaToe();bouwNav();leesCodeUitLink();window.addEventListener('hashchange',leesCodeUitLink);
loadData().then(function(){
  migreerBuit();
  tab(curTab);
  toonSync();
  if(syncOn()){syncOwn().then(function(){return pullParty();});gevHaal();}
});
window.addEventListener('online',function(){toonSync();if(syncOn())syncOwn();});
window.addEventListener('offline',toonSync);
setInterval(function(){if(syncOn()&&!document.hidden)toonSync();},60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){loadData().then(function(){if(!typing())render();});if(syncOn())syncOwn();}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
